<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CrusorAI Android Smoke Test — Live UI</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: #0d1117;
    color: #e6edf3;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 24px;
  }
  h1 { font-size: 1.5rem; font-weight: 600; letter-spacing: -0.02em; }
  .sub { color: #8b949e; font-size: 0.9rem; margin: 8px 0 32px; }
  .sub code { color: #79c0ff; background: #161b22; padding: 2px 8px; border-radius: 6px; font-size: 0.85rem; }
  .row { display: flex; gap: 48px; flex-wrap: wrap; justify-content: center; }
  .panel { display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .badge {
    font-size: 0.75rem; font-weight: 700; letter-spacing: 0.12em;
    padding: 6px 14px; border-radius: 999px; text-transform: uppercase;
  }
  .badge.before { background: #1f2937; color: #9ca3af; border: 1px solid #374151; }
  .badge.after  { background: #052e16; color: #4ade80; border: 1px solid #14532d; }
  .phone {
    width: 300px; height: 610px;
    border-radius: 36px;
    border: 3px solid #30363d;
    background: #000;
    padding: 14px;
    box-shadow: 0 24px 60px rgba(0,0,0,.55), inset 0 0 0 2px #161b22;
    position: relative;
  }
  .phone::before {
    content: ''; position: absolute; top: 22px; left: 50%; transform: translateX(-50%);
    width: 84px; height: 9px; border-radius: 6px; background: #21262d; z-index: 2;
  }
  .screen { width: 100%; height: 100%; border-radius: 24px; overflow: hidden; background: #05070a; }
  .screen img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .controls { margin-top: 40px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; justify-content: center; }
  button {
    background: #21262d; color: #e6edf3; border: 1px solid #30363d;
    padding: 10px 20px; border-radius: 10px; font-size: 0.9rem; cursor: pointer;
  }
  button:hover { background: #30363d; }
  label { font-size: 0.85rem; color: #8b949e; display: flex; align-items: center; gap: 8px; cursor: pointer; }
  input[type=checkbox] { accent-color: #3fb950; width: 16px; height: 16px; }
  .status { font-size: 0.85rem; color: #4ade80; min-width: 180px; }
  .stage { margin-top: 10px; color: #6e7681; font-size: 0.8rem; text-align: center; }
</style>
</head>
<body>
  <h1>CrusorAI Android Smoke Test</h1>
  <div class="sub">Live captures from <code>emulator-5554</code> · app <code>com.crusorai.smoketest</code> · Android 15</div>

  <div class="row">
    <div class="panel">
      <span class="badge before">Before tap</span>
      <div class="phone"><div class="screen"><img id="imgBefore" src="before.png" alt="Before tap — Ready on Android 15"></div></div>
      <div class="stage">status: "Ready on Android 15"</div>
    </div>
    <div class="panel">
      <span class="badge after">After tap</span>
      <div class="phone"><div class="screen"><img id="imgAfter" src="after.png" alt="After tap — Interaction OK"></div></div>
      <div class="stage">status: "Interaction OK"</div>
    </div>
  </div>

  <div class="controls">
    <button id="refresh">&#x21bb; Refresh now</button>
    <label><input type="checkbox" id="auto" checked> Auto-refresh every 3s</label>
    <span class="status" id="status">watching…</span>
  </div>

<script>
  const bust = (id) => {
    const el = document.getElementById(id);
    el.src = el.src.split('?')[0] + '?t=' + Date.now();
  };
  const tick = () => {
    bust('imgBefore'); bust('imgAfter');
    document.getElementById('status').textContent = 'last refresh ' + new Date().toLocaleTimeString();
  };
  let timer = setInterval(tick, 3000);
  document.getElementById('refresh').addEventListener('click', tick);
  document.getElementById('auto').addEventListener('change', (e) => {
    clearInterval(timer);
    if (e.target.checked) timer = setInterval(tick, 3000);
  });
  tick();
</script>
</body>
</html>
