<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" font-family="Inter, system-ui, sans-serif">
  <rect width="960" height="620" fill="#111111"/>
  <text x="36" y="46" fill="#f0f0f0" font-size="22" font-weight="700">Pulse native-neutral color study — approved direction</text>
  <text x="36" y="70" fill="#8b8b8b" font-size="12">VS Code Dark 2026 native chrome; Pulse semantic colors only on Pulse surfaces and states.</text>

  <!-- Native-neutral foundations -->
  <g font-size="11">
    <text x="36" y="116" fill="#cccccc" font-weight="700">Native-neutral foundations</text>
    <g>
      <rect x="36" y="130" width="90" height="26" fill="#111111" stroke="#2b2b2b"/>
      <text x="140" y="147" fill="#8b8b8b">--bg  #111111</text>
    </g>
    <g>
      <rect x="36" y="164" width="90" height="26" fill="#181818" stroke="#2b2b2b"/>
      <text x="140" y="181" fill="#8b8b8b">--chrome  #181818</text>
    </g>
    <g>
      <rect x="36" y="198" width="90" height="26" fill="#181818" stroke="#2b2b2b"/>
      <text x="140" y="215" fill="#8b8b8b">--surface  #181818</text>
    </g>
    <g>
      <rect x="36" y="232" width="90" height="26" fill="#1d1d1d" stroke="#2b2b2b"/>
      <text x="140" y="249" fill="#8b8b8b">--surface-2  #1d1d1d</text>
    </g>
    <g>
      <rect x="36" y="266" width="90" height="26" fill="#2a2d2e" stroke="#2b2b2b"/>
      <text x="140" y="283" fill="#8b8b8b">--surface-active  #2a2d2e</text>
    </g>
    <g>
      <rect x="36" y="300" width="90" height="26" fill="#1f1f1f" stroke="#2b2b2b"/>
      <text x="140" y="317" fill="#8b8b8b">--editor  #1f1f1f</text>
    </g>
    <g>
      <rect x="36" y="334" width="90" height="26" fill="none" stroke="#2b2b2b"/>
      <text x="140" y="351" fill="#8b8b8b">--border  #2b2b2b</text>
    </g>
    <g>
      <rect x="36" y="368" width="90" height="26" fill="none" stroke="#252525"/>
      <text x="140" y="385" fill="#8b8b8b">--border-soft  #252525</text>
    </g>
    <g>
      <rect x="36" y="402" width="90" height="26" fill="#cccccc" opacity="0.14" stroke="#2b2b2b"/>
      <text x="140" y="419" fill="#8b8b8b">--text  #cccccc</text>
    </g>
    <g>
      <rect x="36" y="436" width="90" height="26" fill="#f0f0f0" opacity="0.22" stroke="#2b2b2b"/>
      <text x="140" y="453" fill="#8b8b8b">--strong  #f0f0f0</text>
    </g>
    <g>
      <rect x="36" y="470" width="90" height="26" fill="#8b8b8b" opacity="0.35" stroke="#2b2b2b"/>
      <text x="140" y="487" fill="#8b8b8b">--muted  #8b8b8b</text>
    </g>
    <g>
      <rect x="36" y="504" width="90" height="26" fill="#666666" opacity="0.4" stroke="#2b2b2b"/>
      <text x="140" y="521" fill="#8b8b8b">--faint  #666666</text>
    </g>
  </g>

  <!-- Pulse semantic colors -->
  <g font-size="11">
    <text x="360" y="116" fill="#cccccc" font-weight="700">Pulse semantic colors (allowed surfaces only)</text>
    <g>
      <rect x="360" y="130" width="90" height="26" fill="#22d3ee"/>
      <text x="464" y="147" fill="#8b8b8b">cyan #22D3EE — running/focus/primary, logo, transcript rail, send/allow</text>
    </g>
    <g>
      <rect x="360" y="164" width="90" height="26" fill="#9b8cff"/>
      <text x="464" y="181" fill="#8b8b8b">violet #9B8CFF — sub-agent/delegation only</text>
    </g>
    <g>
      <rect x="360" y="198" width="90" height="26" fill="#49d190"/>
      <text x="464" y="215" fill="#8b8b8b">green #49D190 — verified/passed only</text>
    </g>
    <g>
      <rect x="360" y="232" width="90" height="26" fill="#efb75c"/>
      <text x="464" y="249" fill="#8b8b8b">amber #EFB75C — approval/warning only</text>
    </g>
    <g>
      <rect x="360" y="266" width="90" height="26" fill="#ed727c"/>
      <text x="464" y="283" fill="#8b8b8b">red #ED727C — failure/destructive only</text>
    </g>
  </g>

  <!-- Rules -->
  <g font-size="12">
    <text x="360" y="340" fill="#cccccc" font-weight="700">Rules</text>
    <text x="360" y="362" fill="#8b8b8b">• No global .monaco-workbench fill/background overrides; chrome = native Dark 2026.</text>
    <text x="360" y="384" fill="#8b8b8b">• Cyan is never a large chrome background; it marks the selected Activity Bar item,</text>
    <text x="372" y="404" fill="#8b8b8b">  logo, streaming state, active transcript rail, focus, and send/allow primary actions.</text>
    <text x="360" y="426" fill="#8b8b8b">• Logo, platform icons, product identifiers, and Pulse semantic tokens stay.</text>
    <text x="360" y="448" fill="#8b8b8b">• High-contrast and user themes remain authoritative.</text>
    <text x="360" y="470" fill="#8b8b8b">• Acceptance: hiding the Pulse panel leaves a stock-looking Code OSS Dark 2026 window.</text>
  </g>
</svg>
