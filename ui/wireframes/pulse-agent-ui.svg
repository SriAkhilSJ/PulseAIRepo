<svg xmlns="http://www.w3.org/2000/svg" width="420" height="900" viewBox="0 0 420 900" role="img" aria-labelledby="title desc">
  <title id="title">PulseAI IDE compact Agent UI wireframe</title>
  <desc id="desc">Dense, flat agent transcript with inline tool rows, a pinned approval strip, and composer. No activity graph and no floating card collection.</desc>
  <defs>
    <style>
      .bg{fill:#0d1117}.panel{fill:#10161d}.raised{fill:#151c24}.line{stroke:#29323d;stroke-width:1}.soft{stroke:#202934;stroke-width:1}.accent{stroke:#22d3ee;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}.green{stroke:#49d190;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}.amber{stroke:#efb75c;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}.muted{fill:#8491a1}.faint{fill:#596675}.text{fill:#dce4ec}.strong{fill:#f5f8fa;font-weight:600}.cyan{fill:#22d3ee}.good{fill:#49d190}.warn{fill:#efb75c}.danger{fill:#ed727c}.sans{font-family:Inter,Segoe UI,Arial,sans-serif}.mono{font-family:Consolas,SFMono-Regular,monospace}.xs{font-size:9px}.sm{font-size:10px}.md{font-size:12px}.lg{font-size:14px}.caps{font-size:8px;letter-spacing:1.4px;font-weight:700}.hair{stroke:#22d3ee;stroke-width:2}.dash{stroke:#455260;stroke-width:1;stroke-dasharray:2 3}
    </style>
    <symbol id="pulse" viewBox="0 0 24 24"><path d="M2 12h4l2-6 4 12 3-9 2 3h5"/></symbol>
    <symbol id="check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
    <symbol id="chev" viewBox="0 0 24 24"><path d="m9 7 5 5-5 5"/></symbol>
    <symbol id="file" viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6zM14 3v5h4"/></symbol>
    <symbol id="lock" viewBox="0 0 24 24"><path d="M6 10h12v10H6zM8 10V7a4 4 0 0 1 8 0v3"/></symbol>
    <symbol id="send" viewBox="0 0 24 24"><path d="m3 4 18 8-18 8 4-8zM7 12h14"/></symbol>
    <symbol id="branch" viewBox="0 0 24 24"><path d="M6 3v12a4 4 0 0 0 4 4h7M18 3v5a4 4 0 0 1-4 4H6"/></symbol>
    <symbol id="more" viewBox="0 0 24 24"><path d="M5 12h.01M12 12h.01M19 12h.01"/></symbol>
  </defs>

  <rect width="420" height="900" class="bg"/>
  <rect x="0.5" y="0.5" width="419" height="899" fill="none" stroke="#34404d"/>

  <!-- title bar -->
  <rect x="1" y="1" width="418" height="40" class="panel"/>
  <line x1="1" y1="40.5" x2="419" y2="40.5" class="line"/>
  <use href="#pulse" x="14" y="12" width="16" height="16" class="accent"/>
  <text x="38" y="25" class="sans strong md">Pulse</text>
  <text x="318" y="24" class="sans muted xs">main</text>
  <circle cx="359" cy="21" r="3.5" fill="#22d3ee"/>
  <text x="368" y="24" class="sans muted xs">ready</text>
  <use href="#more" x="394" y="13" width="16" height="16" class="accent" style="stroke:#8491a1"/>

  <!-- task header, flat -->
  <rect x="1" y="41" width="418" height="74" class="panel"/>
  <text x="14" y="59" class="sans faint caps">CURRENT SESSION</text>
  <text x="14" y="81" class="sans strong lg">Fix authentication redirect</text>
  <text x="14" y="101" class="sans muted xs">Agent mode</text>
  <text x="81" y="101" class="sans faint xs">•</text>
  <text x="91" y="101" class="sans muted xs">2 of 3 steps</text>
  <text x="327" y="81" class="sans cyan xs">Working</text>
  <circle cx="314" cy="77" r="3.5" fill="#22d3ee"/>
  <line x1="1" y1="114.5" x2="419" y2="114.5" class="line"/>

  <!-- numeric receipt, no graph -->
  <g transform="translate(0 115)">
    <rect width="420" height="34" class="bg"/>
    <text x="14" y="14" class="sans faint xs">Context</text><text x="14" y="27" class="sans text sm">38.4k / 128k</text>
    <line x1="107" y1="7" x2="107" y2="27" class="soft"/>
    <text x="122" y="14" class="sans faint xs">In</text><text x="122" y="27" class="sans text sm">12.8k</text>
    <text x="187" y="14" class="sans faint xs">Cache</text><text x="187" y="27" class="sans cyan sm">9.42k</text>
    <text x="266" y="14" class="sans faint xs">Calls</text><text x="266" y="27" class="sans text sm">6</text>
    <text x="325" y="14" class="sans faint xs">Cost</text><text x="325" y="27" class="sans text sm">$0.031</text>
    <line x1="0" y1="33.5" x2="420" y2="33.5" class="line"/>
  </g>

  <!-- transcript -->
  <text x="14" y="172" class="sans faint caps">TRANSCRIPT</text>
  <text x="406" y="172" text-anchor="end" class="sans faint xs">10:42</text>

  <!-- user line, no bubble card -->
  <line x1="14" y1="188" x2="14" y2="248" stroke="#556271" stroke-width="2"/>
  <text x="25" y="198" class="sans text sm">You</text>
  <text x="25" y="218" class="sans muted sm">Fix the redirect loop after login. Keep the</text>
  <text x="25" y="234" class="sans muted sm">original destination and verify in the browser.</text>
  <line x1="14" y1="255.5" x2="406" y2="255.5" class="soft"/>

  <!-- assistant stream -->
  <line x1="14" y1="271" x2="14" y2="347" class="hair"/>
  <use href="#pulse" x="25" y="269" width="14" height="14" class="accent"/>
  <text x="46" y="280" class="sans strong sm">Pulse</text>
  <text x="25" y="302" class="sans muted sm">I traced the loop to a stale session cookie.</text>
  <text x="25" y="318" class="sans muted sm">I’ll clear it before the callback redirect, keep</text>
  <text x="25" y="334" class="sans muted sm">the intended route, and verify the complete flow.</text>
  <rect x="324" y="324" width="1.5" height="11" fill="#22d3ee"/>

  <!-- flat inline tools -->
  <g transform="translate(14 360)">
    <text x="0" y="0" class="sans faint caps">ACTIONS</text>
    <g transform="translate(0 15)">
      <use href="#check" x="0" y="9" width="15" height="15" class="green"/>
      <text x="25" y="20" class="sans strong sm">Read</text>
      <text x="57" y="20" class="mono muted xs">src/auth/callback.ts</text>
      <text x="364" y="20" text-anchor="end" class="sans faint xs">84ms</text>
      <line x1="0" y1="34.5" x2="392" y2="34.5" class="soft"/>
    </g>
    <g transform="translate(0 50)">
      <use href="#lock" x="0" y="9" width="15" height="15" class="amber"/>
      <text x="25" y="20" class="sans strong sm">Edit</text>
      <text x="55" y="20" class="mono muted xs">src/auth/session.ts</text>
      <text x="301" y="20" class="sans good xs">+12</text>
      <text x="327" y="20" class="sans danger xs">−4</text>
      <text x="364" y="20" text-anchor="end" class="sans warn xs">review</text>
      <line x1="0" y1="34.5" x2="392" y2="34.5" class="soft"/>
    </g>
    <g transform="translate(0 85)">
      <circle cx="7.5" cy="16.5" r="5.5" fill="none" stroke="#536171"/>
      <text x="25" y="20" class="sans strong sm">Verify</text>
      <text x="65" y="20" class="sans muted xs">Typecheck + browser callback</text>
      <text x="364" y="20" text-anchor="end" class="sans faint xs">queued</text>
      <line x1="0" y1="34.5" x2="392" y2="34.5" class="soft"/>
    </g>
  </g>

  <!-- tiny plan trace: list, not graph -->
  <g transform="translate(14 497)">
    <text x="0" y="0" class="sans faint caps">PLAN</text>
    <line x1="6" y1="16" x2="6" y2="70" class="dash"/>
    <use href="#check" x="0" y="12" width="13" height="13" class="green"/>
    <text x="22" y="23" class="sans faint xs">Trace callback and cookie lifecycle</text>
    <circle cx="6" cy="43" r="4" fill="#0d1117" stroke="#22d3ee"/>
    <text x="22" y="46" class="sans text xs">Repair stale-session handling</text>
    <circle cx="6" cy="66" r="3.5" fill="#0d1117" stroke="#596675"/>
    <text x="22" y="69" class="sans faint xs">Prove browser callback flow</text>
  </g>

  <!-- anchored approval dock: flat, full width -->
  <g transform="translate(1 598)">
    <rect width="418" height="145" fill="#12171d"/>
    <line x1="0" y1="0.5" x2="418" y2="0.5" stroke="#efb75c"/>
    <rect x="0" y="0" width="3" height="145" fill="#efb75c"/>
    <use href="#lock" x="14" y="14" width="16" height="16" class="amber"/>
    <text x="40" y="26" class="sans strong md">Permission required</text>
    <text x="14" y="49" class="sans muted sm">Pulse wants to edit a tracked file.</text>
    <line x1="14" y1="64.5" x2="404" y2="64.5" class="soft"/>
    <use href="#file" x="14" y="76" width="15" height="15" class="accent" style="stroke:#8491a1"/>
    <text x="39" y="88" class="mono text xs">src/auth/session.ts</text>
    <text x="305" y="88" class="sans good xs">+12</text>
    <text x="334" y="88" class="sans danger xs">−4</text>
    <use href="#chev" x="383" y="76" width="15" height="15" class="accent" style="stroke:#8491a1"/>
    <line x1="14" y1="101.5" x2="404" y2="101.5" class="soft"/>
    <text x="14" y="127" class="sans muted sm">Deny</text>
    <text x="236" y="127" class="sans text sm">Open native diff</text>
    <rect x="331" y="108" width="73" height="26" fill="#22d3ee" rx="2"/>
    <text x="367.5" y="125" text-anchor="middle" class="sans sm" fill="#061115" font-weight="700">Approve</text>
  </g>

  <!-- prompt -->
  <g transform="translate(1 743)">
    <rect width="418" height="134" class="panel"/>
    <line x1="0" y1="0.5" x2="418" y2="0.5" class="line"/>
    <rect x="14" y="14" width="390" height="78" fill="#0d1117" stroke="#364250"/>
    <text x="26" y="36" class="sans faint sm">Steer Pulse or add context…</text>
    <text x="25" y="79" class="sans cyan sm">@</text>
    <text x="38" y="79" class="sans muted xs">Context</text>
    <text x="97" y="79" class="sans muted xs">Agent</text>
    <rect x="365" y="55" width="27" height="27" fill="#22d3ee" rx="2"/>
    <use href="#send" x="371" y="61" width="15" height="15" style="stroke:#061115;fill:none;stroke-width:1.7"/>
    <text x="14" y="112" class="sans faint xs">Enter to send</text>
    <text x="406" y="112" text-anchor="end" class="sans faint xs">Shift+Enter for new line</text>
  </g>

  <!-- status -->
  <rect x="1" y="877" width="418" height="22" fill="#0b333b"/>
  <use href="#branch" x="10" y="881" width="13" height="13" class="accent"/>
  <text x="29" y="891" class="sans text xs">main*</text>
  <text x="330" y="891" class="sans cyan xs">Pulse ready</text>
</svg>
