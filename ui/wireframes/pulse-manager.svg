<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Pulse Manager wireframe</title>
  <desc id="desc">Dense three-column manager with workspace and agent hierarchy, continuous transcript, and evidence inspector. Flat rows and separators, no graphs or card dashboard.</desc>
  <defs>
    <style>
      .bg{fill:#0c1117}.side{fill:#0e141b}.main{fill:#10161d}.raised{fill:#151d26}.line{stroke:#29333e;stroke-width:1}.soft{stroke:#202a34;stroke-width:1}.accent{stroke:#22d3ee;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}.green{stroke:#49d190;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}.amber{stroke:#efb75c;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}.muted{fill:#8996a6}.faint{fill:#5c6978}.text{fill:#dce4ec}.strong{fill:#f5f8fa;font-weight:600}.cyan{fill:#22d3ee}.good{fill:#49d190}.warn{fill:#efb75c}.danger{fill:#ed727c}.violet{fill:#9b8cff}.sans{font-family:Inter,Segoe UI,Arial,sans-serif}.mono{font-family:Consolas,SFMono-Regular,monospace}.xs{font-size:10px}.sm{font-size:11px}.md{font-size:13px}.lg{font-size:16px}.xl{font-size:18px}.caps{font-size:9px;letter-spacing:1.5px;font-weight:700}.dash{stroke:#455260;stroke-width:1;stroke-dasharray:3 4}
    </style>
    <symbol id="pulse" viewBox="0 0 24 24"><path d="M2 12h4l2-6 4 12 3-9 2 3h5"/></symbol>
    <symbol id="check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
    <symbol id="chev" viewBox="0 0 24 24"><path d="m9 7 5 5-5 5"/></symbol>
    <symbol id="folder" viewBox="0 0 24 24"><path d="M3 6h7l2 2h9v11H3z"/></symbol>
    <symbol id="file" viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6zM14 3v5h4"/></symbol>
    <symbol id="branch" viewBox="0 0 24 24"><path d="M6 3v12a4 4 0 0 0 4 4h7M18 3v5a4 4 0 0 1-4 4H6"/></symbol>
    <symbol id="terminal" viewBox="0 0 24 24"><path d="M4 5h16v14H4zM7 9l3 3-3 3M12 15h5"/></symbol>
    <symbol id="diff" viewBox="0 0 24 24"><path d="M7 3v18M4 7l3-3 3 3M17 21V3m-3 14 3 3 3-3"/></symbol>
    <symbol id="agent" viewBox="0 0 24 24"><path d="M7 8h10a3 3 0 0 1 3 3v6a3 3 0 0 1-3 3H7a3 3 0 0 1-3-3v-6a3 3 0 0 1 3-3M12 3v5M9 14h.01M15 14h.01M9 17h6"/></symbol>
    <symbol id="search" viewBox="0 0 24 24"><path d="M11 18a7 7 0 1 1 0-14 7 7 0 0 1 0 14m5-2 5 5"/></symbol>
    <symbol id="clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v6l4 2"/></symbol>
    <symbol id="restore" viewBox="0 0 24 24"><path d="M4 4v6h6M5 9a8 8 0 1 1 2 8"/></symbol>
    <symbol id="pause" viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"/></symbol>
    <symbol id="send" viewBox="0 0 24 24"><path d="m3 4 18 8-18 8 4-8zM7 12h14"/></symbol>
    <symbol id="plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="more" viewBox="0 0 24 24"><path d="M5 12h.01M12 12h.01M19 12h.01"/></symbol>
  </defs>

  <rect width="1440" height="900" class="bg"/>
  <rect x="0.5" y="0.5" width="1439" height="899" fill="none" stroke="#34404c"/>

  <!-- global title -->
  <rect x="1" y="1" width="1438" height="42" class="side"/>
  <line x1="1" y1="42.5" x2="1439" y2="42.5" class="line"/>
  <rect x="13" y="9" width="25" height="25" rx="5" fill="#123039" stroke="#27616c"/>
  <use href="#pulse" x="18" y="14" width="15" height="15" class="accent"/>
  <text x="48" y="27" class="sans strong md">PulseAI</text>
  <text x="104" y="27" class="sans faint xs">IDE</text>
  <text x="720" y="27" text-anchor="middle" class="sans text sm">Pulse Manager</text>
  <circle cx="1320" cy="21" r="3.5" fill="#22d3ee"/>
  <text x="1331" y="25" class="sans muted xs">Engine ready</text>

  <!-- left control plane -->
  <rect x="1" y="43" width="270" height="856" class="side"/>
  <line x1="270.5" y1="43" x2="270.5" y2="899" class="line"/>
  <text x="16" y="67" class="sans faint caps">CONTROL PLANE</text>
  <text x="16" y="91" class="sans strong lg">Workspaces</text>
  <use href="#plus" x="239" y="70" width="17" height="17" class="accent" style="stroke:#8996a6"/>
  <rect x="13" y="106" width="245" height="31" fill="#0c1117" stroke="#2c3743"/>
  <use href="#search" x="23" y="114" width="14" height="14" class="accent" style="stroke:#5c6978"/>
  <text x="45" y="126" class="sans faint xs">Find workspace or agent</text>

  <g transform="translate(0 151)">
    <use href="#chev" x="14" y="0" width="14" height="14" class="accent" style="stroke:#8996a6" transform="rotate(90 21 7)"/>
    <use href="#folder" x="34" y="0" width="15" height="15" class="accent" style="stroke:#8996a6"/>
    <text x="56" y="12" class="sans strong sm">PulseAIRepo</text>
    <text x="246" y="12" text-anchor="end" class="sans faint xs">3</text>

    <rect x="7" y="25" width="256" height="48" fill="#112d34"/>
    <rect x="7" y="25" width="2" height="48" fill="#22d3ee"/>
    <use href="#branch" x="18" y="36" width="16" height="16" class="accent"/>
    <text x="43" y="43" class="sans strong sm">main</text>
    <text x="43" y="59" class="sans muted xs">Local workspace</text>
    <text x="220" y="45" class="sans good xs">+30</text>
    <text x="248" y="45" class="sans danger xs">−4</text>

    <text x="16" y="95" class="sans faint caps">ACTIVE AGENTS</text>

    <!-- parent session -->
    <rect x="0" y="107" width="270" height="52" class="raised"/>
    <rect x="0" y="107" width="2" height="52" fill="#22d3ee"/>
    <circle cx="21" cy="129" r="4" fill="#22d3ee"/>
    <text x="39" y="128" class="sans strong sm">Fix authentication redirect</text>
    <text x="39" y="144" class="sans faint xs">fix/session-redirect</text>
    <text x="254" y="128" text-anchor="end" class="sans faint xs">3m 14s</text>

    <!-- hierarchy wires, not node graph -->
    <path d="M21 159v72M21 181h14M21 220h14" fill="none" stroke="#364451"/>
    <circle cx="42" cy="181" r="3.5" fill="#49d190"/>
    <text x="55" y="180" class="sans text xs">Trace callback flow</text>
    <text x="55" y="194" class="sans faint" font-size="8">research · complete</text>
    <circle cx="42" cy="220" r="3.5" fill="#22d3ee"/>
    <text x="55" y="219" class="sans text xs">Browser verification</text>
    <text x="55" y="233" class="sans faint" font-size="8">test · working</text>

    <line x1="13" y1="249.5" x2="257" y2="249.5" class="soft"/>
    <circle cx="21" cy="273" r="4" fill="#647283"/>
    <text x="39" y="272" class="sans text xs">Refactor retrieval ranking</text>
    <text x="39" y="286" class="sans faint" font-size="8">queued</text>

    <line x1="0" y1="315.5" x2="270" y2="315.5" class="line"/>
    <use href="#chev" x="14" y="329" width="14" height="14" class="accent" style="stroke:#8996a6"/>
    <use href="#folder" x="34" y="329" width="15" height="15" class="accent" style="stroke:#8996a6"/>
    <text x="56" y="341" class="sans strong sm">marketing-site</text>
    <text x="246" y="341" text-anchor="end" class="sans faint xs">2</text>
    <text x="34" y="365" class="sans faint xs">1 queued  ·  1 complete</text>
  </g>

  <line x1="1" y1="861.5" x2="270" y2="861.5" class="line"/>
  <text x="16" y="883" class="sans muted xs">Manager settings</text>
  <text x="254" y="883" text-anchor="end" class="sans faint" font-size="8">3 agents</text>

  <!-- main -->
  <rect x="271" y="43" width="845" height="856" class="main"/>
  <line x1="1116.5" y1="43" x2="1116.5" y2="899" class="line"/>

  <!-- session header -->
  <text x="291" y="66" class="sans faint xs">PulseAIRepo  /  fix/session-redirect</text>
  <text x="291" y="91" class="sans strong xl">Fix authentication redirect</text>
  <circle cx="533" cy="86" r="3.5" fill="#22d3ee"/>
  <text x="545" y="90" class="sans muted xs">Working</text>
  <use href="#pause" x="956" y="69" width="16" height="16" class="accent" style="stroke:#8996a6"/>
  <text x="979" y="82" class="sans muted xs">Pause</text>
  <use href="#diff" x="1031" y="69" width="16" height="16" class="accent" style="stroke:#8996a6"/>
  <text x="1054" y="82" class="sans text xs">Review</text>
  <line x1="271" y1="105.5" x2="1116" y2="105.5" class="line"/>

  <!-- tabs -->
  <g transform="translate(271 106)">
    <use href="#agent" x="20" y="11" width="15" height="15" class="accent"/>
    <text x="43" y="23" class="sans text xs">Session</text>
    <line x1="0" y1="37.5" x2="99" y2="37.5" stroke="#22d3ee"/>
    <use href="#terminal" x="121" y="11" width="15" height="15" class="accent" style="stroke:#8996a6"/>
    <text x="144" y="23" class="sans muted xs">Terminal 1</text>
    <use href="#diff" x="226" y="11" width="15" height="15" class="accent" style="stroke:#8996a6"/>
    <text x="249" y="23" class="sans muted xs">Changes 2</text>
    <line x1="0" y1="37.5" x2="845" y2="37.5" class="line"/>
  </g>

  <!-- continuous transcript, centered lane -->
  <g transform="translate(350 169)">
    <text x="0" y="0" class="sans faint caps">TRANSCRIPT</text>
    <text x="687" y="0" text-anchor="end" class="sans faint xs">10:42</text>

    <line x1="498" y1="18" x2="498" y2="84" stroke="#556271" stroke-width="2"/>
    <text x="486" y="32" text-anchor="end" class="sans text xs">You</text>
    <text x="486" y="53" text-anchor="end" class="sans muted sm">Fix the redirect loop after login. Keep the intended</text>
    <text x="486" y="69" text-anchor="end" class="sans muted sm">destination and verify the callback flow.</text>
    <line x1="0" y1="97.5" x2="687" y2="97.5" class="soft"/>

    <line x1="0" y1="116" x2="0" y2="204" stroke="#22d3ee" stroke-width="2"/>
    <use href="#pulse" x="14" y="114" width="15" height="15" class="accent"/>
    <text x="37" y="127" class="sans strong sm">Pulse</text>
    <text x="14" y="152" class="sans muted sm">I traced the loop to a stale session cookie surviving the callback. I’ll clear it before redirect,</text>
    <text x="14" y="170" class="sans muted sm">preserve the intended route, and verify the complete flow in the browser.</text>

    <!-- flat action rows -->
    <text x="0" y="227" class="sans faint caps">ACTIONS</text>
    <g transform="translate(0 239)">
      <use href="#check" x="0" y="10" width="15" height="15" class="green"/>
      <text x="26" y="21" class="sans strong sm">Read</text>
      <text x="62" y="21" class="mono muted xs">src/auth/callback.ts</text>
      <text x="687" y="21" text-anchor="end" class="sans faint xs">84ms</text>
      <line x1="0" y1="37.5" x2="687" y2="37.5" class="soft"/>
    </g>
    <g transform="translate(0 277)">
      <rect x="1" y="11" width="13" height="13" fill="none" stroke="#efb75c"/>
      <text x="26" y="21" class="sans strong sm">Edit</text>
      <text x="58" y="21" class="mono muted xs">src/auth/session.ts</text>
      <text x="563" y="21" class="sans good xs">+12</text>
      <text x="596" y="21" class="sans danger xs">−4</text>
      <text x="687" y="21" text-anchor="end" class="sans warn xs">approval</text>
      <line x1="0" y1="37.5" x2="687" y2="37.5" class="soft"/>
    </g>
    <g transform="translate(0 315)">
      <circle cx="7.5" cy="17" r="5.5" fill="none" stroke="#596675"/>
      <text x="26" y="21" class="sans strong sm">Verify</text>
      <text x="70" y="21" class="sans muted xs">Typecheck + browser callback</text>
      <text x="687" y="21" text-anchor="end" class="sans faint xs">queued</text>
      <line x1="0" y1="37.5" x2="687" y2="37.5" class="soft"/>
    </g>

    <!-- subagents as tree rows -->
    <text x="0" y="390" class="sans faint caps">SUB-AGENTS</text>
    <text x="687" y="390" text-anchor="end" class="sans faint xs">2</text>
    <line x1="8" y1="406" x2="8" y2="473" stroke="#364451"/>
    <path d="M8 423h15M8 461h15" fill="none" stroke="#364451"/>
    <circle cx="31" cy="423" r="3.5" fill="#49d190"/>
    <use href="#agent" x="45" y="414" width="16" height="16" class="accent" style="stroke:#9b8cff"/>
    <text x="70" y="423" class="sans text sm">Trace callback flow</text>
    <text x="70" y="439" class="sans faint xs">Research · 48s</text>
    <text x="687" y="426" text-anchor="end" class="sans good xs">Complete</text>
    <circle cx="31" cy="461" r="3.5" fill="#22d3ee"/>
    <use href="#agent" x="45" y="452" width="16" height="16" class="accent" style="stroke:#9b8cff"/>
    <text x="70" y="461" class="sans text sm">Browser verification</text>
    <text x="70" y="477" class="sans faint xs">Test · 1m 02s</text>
    <text x="687" y="464" text-anchor="end" class="sans cyan xs">Checking route</text>
  </g>

  <!-- flat prompt at bottom -->
  <line x1="271" y1="782.5" x2="1116" y2="782.5" class="line"/>
  <rect x="316" y="801" width="754" height="64" fill="#0c1117" stroke="#36424f"/>
  <text x="332" y="824" class="sans faint sm">Steer this agent or add context…</text>
  <text x="332" y="851" class="sans cyan xs">@</text>
  <text x="345" y="851" class="sans muted xs">Context</text>
  <rect x="1031" y="827" width="26" height="26" fill="#22d3ee"/>
  <use href="#send" x="1037" y="833" width="14" height="14" style="stroke:#061115;fill:none;stroke-width:1.7"/>
  <text x="316" y="882" class="sans faint" font-size="8">Steers the active run without starting a new session</text>

  <!-- inspector -->
  <rect x="1117" y="43" width="322" height="856" class="side"/>
  <text x="1134" y="68" class="sans faint caps">LIVE EVIDENCE</text>
  <text x="1134" y="92" class="sans strong lg">Run inspector</text>
  <line x1="1117" y1="106.5" x2="1439" y2="106.5" class="line"/>

  <g transform="translate(1134 130)">
    <text x="0" y="0" class="sans muted sm">Plan</text>
    <text x="288" y="0" text-anchor="end" class="sans strong xs">2 / 3</text>
    <line x1="6" y1="20" x2="6" y2="79" class="dash"/>
    <use href="#check" x="0" y="16" width="13" height="13" class="green"/>
    <text x="22" y="27" class="sans faint xs">Trace callback lifecycle</text>
    <circle cx="6" cy="49" r="4" fill="#0e141b" stroke="#22d3ee"/>
    <text x="22" y="52" class="sans text xs">Repair stale-session handling</text>
    <circle cx="6" cy="75" r="3.5" fill="#0e141b" stroke="#596675"/>
    <text x="22" y="78" class="sans faint xs">Prove browser flow</text>
  </g>

  <line x1="1117" y1="233.5" x2="1439" y2="233.5" class="line"/>
  <g transform="translate(1134 257)">
    <text x="0" y="0" class="sans muted sm">Changed files</text><text x="288" y="0" text-anchor="end" class="sans strong xs">2</text>
    <use href="#file" x="0" y="20" width="15" height="15" class="accent" style="stroke:#8996a6"/>
    <text x="25" y="31" class="mono text xs">session.ts</text><text x="239" y="31" class="sans good xs">+12</text><text x="270" y="31" class="sans danger xs">−4</text>
    <text x="25" y="45" class="sans faint" font-size="8">src/auth</text>
    <line x1="0" y1="55.5" x2="288" y2="55.5" class="soft"/>
    <use href="#file" x="0" y="66" width="15" height="15" class="accent" style="stroke:#8996a6"/>
    <text x="25" y="77" class="mono text xs">callback.test.ts</text><text x="239" y="77" class="sans good xs">+18</text><text x="270" y="77" class="sans danger xs">−0</text>
    <text x="25" y="91" class="sans faint" font-size="8">src/auth</text>
  </g>

  <line x1="1117" y1="371.5" x2="1439" y2="371.5" class="line"/>
  <g transform="translate(1134 395)">
    <text x="0" y="0" class="sans muted sm">Verification</text><circle cx="223" cy="-4" r="3.5" fill="#22d3ee"/><text x="235" y="0" class="sans cyan xs">Running</text>
    <use href="#check" x="0" y="19" width="14" height="14" class="green"/><text x="24" y="30" class="sans muted xs">Typecheck</text><text x="288" y="30" text-anchor="end" class="sans text xs">Passed</text>
    <circle cx="7" cy="58" r="5" fill="none" stroke="#22d3ee"/><text x="24" y="61" class="sans muted xs">Browser callback</text><text x="288" y="61" text-anchor="end" class="sans text xs">Running</text>
    <circle cx="7" cy="89" r="4.5" fill="none" stroke="#596675"/><text x="24" y="92" class="sans faint xs">Destination assertion</text><text x="288" y="92" text-anchor="end" class="sans faint xs">Queued</text>
  </g>

  <line x1="1117" y1="511.5" x2="1439" y2="511.5" class="line"/>
  <g transform="translate(1134 535)">
    <text x="0" y="0" class="sans muted sm">Checkpoints</text><text x="288" y="0" text-anchor="end" class="sans cyan xs">View all</text>
    <use href="#restore" x="0" y="19" width="15" height="15" class="accent" style="stroke:#8996a6"/><text x="25" y="30" class="sans text xs">Before session edit</text><text x="25" y="45" class="sans faint" font-size="8">10:42 · 2 files</text>
    <use href="#clock" x="0" y="62" width="15" height="15" class="accent" style="stroke:#8996a6"/><text x="25" y="73" class="sans text xs">Initial workspace</text><text x="25" y="88" class="sans faint" font-size="8">10:38 · clean</text>
  </g>

  <line x1="1117" y1="781.5" x2="1439" y2="781.5" class="line"/>
  <g transform="translate(1134 808)">
    <text x="0" y="0" class="sans faint xs">Context</text><text x="0" y="19" class="sans text sm">38.4k / 128k</text>
    <text x="116" y="0" class="sans faint xs">Cache</text><text x="116" y="19" class="sans cyan sm">9.42k</text>
    <text x="207" y="0" class="sans faint xs">Calls</text><text x="207" y="19" class="sans text sm">6</text>
    <line x1="0" y1="35.5" x2="288" y2="35.5" class="soft"/>
    <text x="0" y="57" class="sans faint xs">In 12.8k</text><text x="100" y="57" class="sans faint xs">Out 1.93k</text><text x="288" y="57" text-anchor="end" class="sans text xs">$0.031</text>
  </g>
</svg>
