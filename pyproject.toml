[project]
name = "pulserepo"
version = "0.1.0"
description = "PulseAI – LangGraph autonomous coding agent with a task-aware context engine"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "ddgs>=9.14.4",
    "fastapi>=0.139.2",
    "flask>=3.0.0",
    "flask-cors>=5.0.0",
    "google-genai>=2.14.0",
    "groq>=0.37.1",
    "httpx>=0.28.1",
    "langchain>=1.3.14",
    "langchain-google-genai>=4.3.1",
    "langchain-groq>=1.1.3",
    "langchain-openai>=1.4.0",
    "langgraph>=1.2.9",
    "langgraph-checkpoint-sqlite>=2.0.9",
    "openai>=2.47.0",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "rich>=15.0.0",
    "sentence-transformers>=3.0.0,<4.0.0",
    "sqlite-vec>=0.1.9,<0.3.0",
    "tiktoken>=0.13.0",
    "typer>=0.27.0",
    "uvicorn>=0.51.0",
    "watchdog>=4.0.0,<7.0.0",
    "tree-sitter>=0.24,<0.27",
    "tree-sitter-javascript>=0.23,<0.26",
    "tree-sitter-typescript>=0.23,<0.24",
]

[tool.pyrefly]
project-includes = ["src"]
search-path = ["."]

# uv-native dev group (repo is uv-managed: `uv sync` installs this by default;
# pip users: `uv pip install -e . --group dev`).
[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]
