name: Agent Core performance once

on:
  push:
    branches:
      - arena/a7c2c868-pulseairepo

permissions:
  contents: read

jobs:
  debug-and-verify:
    name: Debug and verify bounded task
    if: contains(github.event.head_commit.message, '[agent-core-performance-once]')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CUSTOM_API_KEY: ${{ secrets.CUSTOM_API_KEY }}
      CUSTOM_BASE_URL: https://velona.in/v1
      LLM_PROVIDER: custom
      LLM_MODEL: z-ai/glm-5.3-flash
      CONTEXT_MODEL: z-ai/glm-5.3-flash
      AUX_LLM_PROVIDER: custom
      AUX_LLM_MODEL: z-ai/glm-5.3-flash
      CRUSORAI_HTTP_USER_AGENT: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36
      CRUSORAI_LLM_STREAMING: 'on'
      CRUSORAI_MEMORY: 'off'
      CRUSORAI_MEMORY_WARMUP_AT_BOOT: 'off'
      CRUSORAI_OTEL: 'off'
      CRUSORAI_WEB_TOOLS: 'off'

    steps:
      - name: Check out exact task commit
        uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Normalize secret without exposing it
        run: |
          python - <<'PY'
          import os
          key = (os.environ.get("CUSTOM_API_KEY") or "").strip()
          assert key and "\n" not in key and "\r" not in key
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as stream:
              stream.write(f"CUSTOM_API_KEY={key}\n")
          print("PASS: secret normalized in runner memory (value not printed)")
          PY

      - name: Install pinned Agent Core runtime
        run: >-
          python -m pip install --disable-pip-version-check
          aiosqlite==0.22.1 ddgs==9.16.1 google-genai==2.33.0
          groq==0.37.1 httpx==0.28.1 langchain==1.4.7
          langchain-google-genai==4.4.2 langchain-groq==1.1.3
          langchain-openai==1.7.3 langgraph==1.2.18
          langgraph-checkpoint-sqlite==3.1.2 mcp==2.3.0
          openai==3.39.0 opentelemetry-api==1.45.1
          opentelemetry-sdk==1.45.1 pillow==13.0.0
          pydantic==2.14.1 python-dotenv==1.2.4 rich==15.0.0
          sqlite-vec==0.1.9 tiktoken==0.14.0 typer==0.27.3 watchdog==6.0.0

      - name: Prepare broken library and immutable tests
        run: |
          set -euo pipefail
          workspace=/tmp/pulseai-performance-task
          rm -rf "$workspace" /tmp/pulseai-performance-results
          mkdir -p "$workspace"
          cat > "$workspace/slugger.py" <<'PY'
          """Small dependency-free slug helpers."""

          def slugify(value: str) -> str:
              return value.strip().lower().replace(" ", "-")


          def unique_slugs(values: list[str]) -> list[str]:
              return [slugify(value) for value in values]
          PY
          cat > "$workspace/test_slugger.py" <<'PY'
          import unittest

          from slugger import slugify, unique_slugs


          class SluggerTests(unittest.TestCase):
              def test_collapses_whitespace_and_punctuation(self):
                  self.assertEqual(slugify("  Hello,   World!  "), "hello-world")

              def test_transliterates_common_accents(self):
                  self.assertEqual(slugify("Crème Brûlée"), "creme-brulee")

              def test_keeps_ascii_letters_and_numbers(self):
                  self.assertEqual(slugify("Release 2026 / RC-1"), "release-2026-rc-1")

              def test_empty_input_stays_empty(self):
                  self.assertEqual(slugify(" -- !! "), "")

              def test_duplicate_slugs_receive_stable_suffixes(self):
                  self.assertEqual(
                      unique_slugs(["Hello World", "hello-world", "Hello, World!"]),
                      ["hello-world", "hello-world-2", "hello-world-3"],
                  )

              def test_distinct_slugs_are_unchanged(self):
                  self.assertEqual(unique_slugs(["Alpha", "Beta 2"]), ["alpha", "beta-2"])


          if __name__ == "__main__":
              unittest.main()
          PY
          sha256sum "$workspace/test_slugger.py" | awk '{print $1}' > /tmp/pulseai-test-hash-before
          sha256sum "$workspace/slugger.py" | awk '{print $1}' > /tmp/pulseai-code-hash-before
          cat > /tmp/pulseai-performance-prompt.txt <<'EOF'
          Repair the small Python slug library in this workspace. Investigate the implementation and tests, then make the minimum production-code changes needed for every test to pass. Do not modify test_slugger.py. Use only the Python standard library and preserve the public function signatures. Run `python -m unittest -v` to verify the complete suite, reread the final implementation, and finish with a concise evidence-based report. Do not inspect unrelated paths.
          EOF

      - name: Run genuine Agent Core debugging task
        id: agent_task
        continue-on-error: true
        run: |
          set -uo pipefail
          date +%s > /tmp/pulseai-started-at
          set +e
          python scripts/run_bridge_turn.py \
            --workspace /tmp/pulseai-performance-task \
            --prompt-file /tmp/pulseai-performance-prompt.txt \
            --run-id "performance-${GITHUB_RUN_ID}" \
            --timeout-s 420 \
            --max-llm-calls 8 \
            --max-input-tokens 100000 \
            --max-no-delivery-calls 0 \
            --results-root /tmp/pulseai-performance-results
          status=$?
          date +%s > /tmp/pulseai-finished-at
          exit "$status"

      - name: Grade performance and sanitized evidence
        if: always()
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path

          workspace = Path("/tmp/pulseai-performance-task")
          run_dir = Path("/tmp/pulseai-performance-results") / f"performance-{os.environ['GITHUB_RUN_ID']}"
          try:
              outcome = json.loads((run_dir / "outcome.json").read_text(encoding="utf-8"))
          except Exception as exc:
              outcome = {"result": "missing-outcome", "completed": False, "error": type(exc).__name__}
          frames = []
          try:
              frames = [json.loads(line) for line in (run_dir / "frames.jsonl").read_text(encoding="utf-8").splitlines() if line.strip()]
          except Exception:
              pass
          test_run = subprocess.run(
              ["python", "-m", "unittest", "-v"],
              cwd=workspace,
              text=True,
              stdout=subprocess.PIPE,
              stderr=subprocess.STDOUT,
              timeout=30,
          )
          test_output = test_run.stdout[-2000:]
          test_hash_before = Path("/tmp/pulseai-test-hash-before").read_text().strip()
          code_hash_before = Path("/tmp/pulseai-code-hash-before").read_text().strip()
          digest = lambda path: hashlib.sha256(path.read_bytes()).hexdigest() if path.is_file() else ""
          test_hash_after = digest(workspace / "test_slugger.py")
          code_hash_after = digest(workspace / "slugger.py")
          started = int(Path("/tmp/pulseai-started-at").read_text().strip()) if Path("/tmp/pulseai-started-at").is_file() else 0
          finished = int(Path("/tmp/pulseai-finished-at").read_text().strip()) if Path("/tmp/pulseai-finished-at").is_file() else 0
          elapsed = max(0, finished - started) if finished else None
          tool_names = []
          for frame in frames:
              if frame.get("type") == "tool_call_start":
                  name = str(frame.get("name") or frame.get("tool_name") or "unknown")
                  tool_names.append(name)
          checks = {
              "turn_done": outcome.get("result") == "turn_done",
              "completed": outcome.get("completed") is True,
              "all_six_tests_pass": test_run.returncode == 0 and "Ran 6 tests" in test_output and "OK" in test_output,
              "tests_unchanged": bool(test_hash_before) and test_hash_after == test_hash_before,
              "production_code_changed": bool(code_hash_before) and code_hash_after != code_hash_before,
              "tool_execution_observed": len(tool_names) >= 1,
              "within_call_bound": int(outcome.get("llm_request_frames") or 0) <= 8,
              "within_token_bound": int(outcome.get("tokens_in_last_telemetry") or 0) <= 100000,
              "no_budget_stop": not bool(outcome.get("budget_stop")),
          }
          passed = all(checks.values())
          receipt = {
              "status": "passed" if passed else "failed",
              "provider": "custom",
              "model": "z-ai/glm-5.3-flash",
              "commit": os.environ["GITHUB_SHA"],
              "checks": checks,
              "result": outcome.get("result"),
              "completed": outcome.get("completed"),
              "elapsed_seconds": elapsed,
              "llm_request_frames": outcome.get("llm_request_frames"),
              "tokens_in_last_telemetry": outcome.get("tokens_in_last_telemetry"),
              "frame_counts": outcome.get("frame_counts"),
              "tool_sequence": tool_names,
              "test_returncode": test_run.returncode,
              "test_summary": [line for line in test_output.splitlines() if line.startswith("Ran ") or line == "OK" or line.startswith("FAILED")],
              "api_key_persisted": False,
          }
          compact = json.dumps(receipt, sort_keys=True, separators=(",", ":"))
          level = "notice" if passed else "error"
          print(f"::{level} file=src/graphs/chat_graph.py,title=Agent Core performance receipt::{compact}")
          print("--- independent grader test tail ---")
          print(test_output)
          Path(os.environ["GITHUB_STEP_SUMMARY"]).write_text(
              "## Agent Core performance receipt\n\n```json\n"
              + json.dumps(receipt, indent=2, sort_keys=True)
              + "\n```\n",
              encoding="utf-8",
          )
          raise SystemExit(0 if passed else 1)
          PY
