name: Security guard

on:
  push:
    paths:
      - 'src/tests/test_security_containment.py'
      - 'scripts/agent_core_checkup.py'
      - 'src/security/sandbox/windows.py'
      - '.github/workflows/security-guard.yml'
  pull_request:
    paths:
      - 'src/tests/test_security_containment.py'
      - 'scripts/agent_core_checkup.py'
      - 'src/security/sandbox/windows.py'
      - '.github/workflows/security-guard.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-containment:
    name: Security containment (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      # Python 3.14: on Windows, CPython <= 3.12 implements
      # platform.win32_ver() by running `cmd /c ver` through
      # subprocess.check_output. src/runtime/windows_shell.py calls
      # platform.system() at import time, so the guarded import probe would
      # correctly flag an import-time process spawn that comes from the
      # standard library, not from a security regression. Python 3.14 reads
      # the version from winreg and spawns nothing, so the probe tests the
      # repository instead of the interpreter. The 3.11 behaviour is recorded
      # as a residual limitation in the Phase 1.3.1 document.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install test dependencies
        shell: bash
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet \
            pytest pyyaml pydantic python-dotenv \
            langchain-core langchain-openai langgraph langgraph-checkpoint-sqlite tiktoken

      - name: Run import-guard security suite
        shell: bash
        run: python -m pytest src/tests/test_security_containment.py -q
