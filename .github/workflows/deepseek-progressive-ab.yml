name: DeepSeek progressive disclosure A/B

on:
  push:
    branches: ['arena/**']
    paths: ['.github/workflows/deepseek-progressive-ab.yml']

permissions:
  contents: read

jobs:
  benchmark:
    if: ${{ contains(github.event.head_commit.message, '[deepseek-progressive-ab]') }}
    name: DeepSeek main / Qwen auxiliary — sequential A/B
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      LLM_PROVIDER: custom
      LLM_MODEL: deepseek/deepseek-v4.1-flash
      CONTEXT_MODEL: deepseek/deepseek-v4.1-flash
      AUX_LLM_PROVIDER: custom
      AUX_LLM_MODEL: qwen/qwen3.7-flash
      CUSTOM_BASE_URL: https://velona.in/v1
      CRUSORAI_DISABLE_LONG_TERM_MEMORY: '1'
      CRUSORAI_MEMORY: 'off'
      CRUSORAI_PREVIEW_AUTOSTART: '0'
      CRUSORAI_SUBAGENT_DEPTH: '0'
      CRUSORAI_LLM_STREAMING: '1'
      CRUSORAI_LLM_TIMEOUT: '180'
      CRUSORAI_LLM_STALL_TIMEOUT_S: '180'
      CRUSORAI_DELIVERY_MAX_TOKENS: '8192'
      CRUSORAI_TASK_CLASSIFIER: 'off'
      SUMMARIZER_LLM: ''
      # Per graph turn, NOT a hard combined or provider-side spending limit.
      AGENT_COST_BUDGET: '0.60'
      CRUSORAI_HTTP_USER_AGENT: >-
        Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36
        (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install runtime and verification dependencies
        run: |
          python -m pip install --upgrade pip
          pip install langchain-core langgraph langgraph-checkpoint-sqlite langgraph-prebuilt \
            langchain langchain-openai langchain-google-genai langchain-groq groq google-genai \
            copilotkit ag-ui-langgraph aiosqlite sqlite-vec watchdog tree-sitter \
            tree-sitter-javascript tree-sitter-typescript tree-sitter-go tree-sitter-rust \
            tree-sitter-java httpx rich typer fastapi uvicorn flask flask-cors pillow mcp \
            opentelemetry-api opentelemetry-sdk opentelemetry-exporter-otlp-proto-http \
            ddgs tiktoken pydantic python-dotenv pytest
      - name: Pin task and validate prices before any paid turn
        env:
          CUSTOM_API_KEY: ${{ secrets.CUSTOM_API_KEY }}
        run: |
          set -euo pipefail
          echo '8e98b4886c4241f4f66e6f6a575c192bf917d07cf2adf2272e0dfa63046c315c  benchmark_ecommerce_prompt.txt' | sha256sum --check
          python - <<'PY'
          from src.telemetry import pricing
          from src.telemetry.call_ledger import estimate_cost_usd
          try:
              rates, source = pricing.refresh()
              print('pricing entries:', len(rates), 'source:', source)
          except Exception as exc:
              print('pricing refresh failed:', type(exc).__name__)
          for model in ('deepseek/deepseek-v4.1-flash', 'qwen/qwen3.7-flash'):
              for direction, args in [('input', (1000000, 0)), ('output', (0, 1000000))]:
                  price = estimate_cost_usd(model, *args)
                  print(model, direction, 'estimated USD/1M:', price)
                  if price is None or price <= 0:
                      raise SystemExit('Pricing unknown: stop before any paid turn')
          PY
      - name: Run baseline then progressive experiment
        env:
          CUSTOM_API_KEY: ${{ secrets.CUSTOM_API_KEY }}
        run: |
          set -uo pipefail
          ROOT="$RUNNER_TEMP/deepseek-ab"
          mkdir -p "$ROOT"
          for arm in off on; do
            echo "=== ARM $arm ==="
            mkdir -p "$ROOT/$arm/ws" "$ROOT/$arm/results"
            export CRUSORAI_PROGRESSIVE_TOOLS="$arm"
            export CRUSORAI_TELEMETRY_DIR="$ROOT/$arm/telemetry"
            # Seed both isolated processes with the preflight pricing cache.
            mkdir -p "$CRUSORAI_TELEMETRY_DIR"
            if [ -f "$HOME/.crusorai/telemetry/pricing-cache.json" ]; then
              cp "$HOME/.crusorai/telemetry/pricing-cache.json" "$CRUSORAI_TELEMETRY_DIR/pricing-cache.json"
            fi
            python scripts/run_bridge_turn.py \
              --continuous --workspace "$ROOT/$arm/ws" \
              --prompt-file benchmark_ecommerce_prompt.txt \
              --run-id "deepseek-$arm-${{ github.run_id }}" \
              --timeout-s 1100 --max-input-tokens 2500000 \
              --results-root "$ROOT/$arm/results" \
              2>&1 | tee "$ROOT/$arm/runner.log"
            status=${PIPESTATUS[0]}
            printf 'runner_exit=%s\n' "$status" | tee "$ROOT/$arm/runner_exit.txt"
            # A nonzero task verdict is evidence, not a reason to skip the other arm.
          done
      - name: Independently inspect generated workspaces
        if: always()
        run: |
          set +e
          ROOT="$RUNNER_TEMP/deepseek-ab"
          for arm in off on; do
            WS="$ROOT/$arm/ws"
            OUT="$ROOT/$arm/independent.txt"
            mkdir -p "$WS"
            {
              echo '=== files ==='
              find "$WS" -type f -not -path '*/diagnostics/*' -not -path '*/node_modules/*' -not -path '*/__pycache__/*' -printf '%P\n' | sort | head -120
              echo '=== python compilation ==='
              python -m compileall -q "$WS"; echo "compile_exit=$?"
              echo '=== python tests ==='
              if find "$WS" -type f \( -name 'test_*.py' -o -name '*_test.py' \) -not -path '*/diagnostics/*' -not -path '*/node_modules/*' -print -quit | grep -q .; then
                (cd "$WS" && timeout 120 python -m pytest -q --disable-warnings --ignore=diagnostics); echo "pytest_exit=$?"
              else
                echo 'pytest: NOT RUN (no Python test files)'
              fi
              echo '=== server import ==='
              server=$(find "$WS" -name server.py -not -path '*/node_modules/*' -not -path '*/diagnostics/*' -print -quit)
              if [ -n "$server" ]; then
                (cd "$(dirname "$server")" && timeout 30 python -c 'import server'); echo "import_exit=$?"
              else
                echo 'import: NOT RUN (server.py not found)'
              fi
            } > "$OUT" 2>&1
          done
      - name: Redact evidence
        if: always()
        env:
          CUSTOM_API_KEY: ${{ secrets.CUSTOM_API_KEY }}
        run: |
          python - <<'PY'
          import os, re
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'deepseek-ab'
          out = Path(os.environ['RUNNER_TEMP']) / 'deepseek-ab-evidence'
          out.mkdir(parents=True, exist_ok=True)
          key = (os.environ.get('CUSTOM_API_KEY') or '').strip()
          for p in root.rglob('*') if root.exists() else []:
              if not p.is_file() or p.is_symlink() or p.stat().st_size > 8_000_000:
                  continue
              rel = p.relative_to(root)
              if any(part in {'.git', 'node_modules', '__pycache__', '.env'} for part in rel.parts):
                  continue
              if p.suffix.lower() not in {'.py', '.js', '.ts', '.tsx', '.jsx', '.json', '.jsonl', '.html', '.css', '.md', '.txt', '.log', '.yaml', '.yml'}:
                  continue
              try:
                  text = p.read_text(encoding='utf-8')
              except (OSError, UnicodeError):
                  continue
              if key:
                  text = text.replace(key, '[REDACTED]')
              text = re.sub(r'key_live_[A-Za-z0-9_]+', '[REDACTED]', text)
              target = out / rel
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(text, encoding='utf-8')
          PY
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deepseek-progressive-ab-evidence
          path: ${{ runner.temp }}/deepseek-ab-evidence
          if-no-files-found: warn

  collect:
    needs: benchmark
    if: ${{ always() && needs.benchmark.result != 'skipped' && contains(github.event.head_commit.message, '[deepseek-progressive-ab]') }}
    name: Persist redacted evidence (no model calls)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/download-artifact@v4
        with:
          name: deepseek-progressive-ab-evidence
          path: ${{ runner.temp }}/deepseek-evidence
      - name: Commit evidence to the same branch
        run: |
          set -euo pipefail
          DEST="docs/benchmarks/deepseek-progressive-ab-${{ github.run_id }}"
          mkdir -p "$DEST"
          cp -R "$RUNNER_TEMP/deepseek-evidence/." "$DEST/"
          find "$DEST" -type f -printf '%P (%s bytes)\n' | sort
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f "$DEST"
          if ! git diff --cached --quiet; then
            git commit -m "Capture DeepSeek A/B evidence ${{ github.run_id }} [skip ci]"
            git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
          fi
