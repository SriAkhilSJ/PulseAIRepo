name: Windows runtime qualification

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/security/sandbox/windows.py'
      - 'src/tests/test_windows_sandbox_runtime.py'
      - 'src/tests/native/net_probe.c'
      - '.github/workflows/windows-runtime-qualification.yml'
  pull_request:
    paths:
      - 'src/security/sandbox/windows.py'
      - 'src/tests/test_windows_sandbox_runtime.py'
      - 'src/tests/native/net_probe.c'
      - '.github/workflows/windows-runtime-qualification.yml'

permissions:
  contents: read

jobs:
  windows-runtime:
    name: Windows sandbox runtime
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install runtime test dependency
        run: python -m pip install --quiet --upgrade pip pytest

      - name: Run Windows runtime harness
        env:
          CRUSOR_RUN_APPCONTAINER_RUNTIME: '1'
        run: python -m pytest src/tests/test_windows_sandbox_runtime.py -q -rs
