name: Kaggle Colibri Agent Core

on:
  push:
    branches:
      - arena/a7c2c868-pulseairepo
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kaggle-colibri-agent-core
  cancel-in-progress: false

jobs:
  private-gpu-probe:
    name: Private Kaggle GPU probe
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, '[kaggle-colibri]')
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Check out the exact triggering commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'

      - name: Install pinned Kaggle client
        run: >-
          python -m pip install --disable-pip-version-check
          kaggle==1.8.4 requests==2.32.5

      - name: Check out audited Kaggle MCP revision
        env:
          KAGGLE_MCP_COMMIT: bb8c9539a0efe966000fb59d15be12aef2912df2
        run: |
          set -euo pipefail
          git init /tmp/kaggle-mcp
          git -C /tmp/kaggle-mcp remote add origin https://github.com/mtrakretech/kaggle-mcp.git
          git -C /tmp/kaggle-mcp fetch --depth=1 origin "$KAGGLE_MCP_COMMIT"
          git -C /tmp/kaggle-mcp checkout --detach FETCH_HEAD
          test "$(git -C /tmp/kaggle-mcp rev-parse HEAD)" = "$KAGGLE_MCP_COMMIT"
          test "$(python /tmp/kaggle-mcp/kaggle_mcp.py --list-tools | python -c 'import json,sys; print(len(json.load(sys.stdin)))')" = 74

      - name: Run authenticated private GPU notebook through MCP
        env:
          # Public Kaggle profile handle; only the API token is secret.
          KAGGLE_USERNAME: sriakhilsj
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_API_TOKEN }}
        run: >-
          python -m benchmarks.colibri_agent_core.github_kaggle_mcp
          --mcp-script /tmp/kaggle-mcp/kaggle_mcp.py
          --notebook benchmarks/colibri_agent_core/kaggle/colibri_agent_core.ipynb
          --output-dir github-kaggle-results
          --kernel-name pulseai-colibri-agent-core-${{ github.run_id }}
          --expected-pulseai-commit ${{ github.sha }}
          --poll-seconds 60
          --max-wait-seconds 19800

      - name: Publish redacted orchestration failure
        if: failure()
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path("github-kaggle-results/orchestration_receipt.json")
          if path.is_file():
              receipt = json.loads(path.read_text(encoding="utf-8"))
              reason = str(receipt.get("fatal_error") or "unspecified failure")
              phases = [
                  f"{phase.get('name')}={phase.get('status')}"
                  for phase in receipt.get("phases", [])
              ]
          else:
              reason = "orchestration receipt was not created"
              phases = []
          escaped = reason.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print(f"::error file=.github/workflows/kaggle-colibri-agent-core.yml,title=Redacted Kaggle orchestration failure::{escaped}")
          summary = ["## Kaggle Colibri orchestration", "", f"**Result:** `{reason}`"]
          if phases:
              summary.extend(["", "**Bounded phases:** `" + ", ".join(phases) + "`"])
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as stream:
              stream.write("\n".join(summary) + "\n")
          PY

      - name: Upload bounded receipts and Kaggle output
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: kaggle-colibri-agent-core-${{ github.run_id }}
          path: github-kaggle-results/
          if-no-files-found: warn
          retention-days: 14
          compression-level: 6
