name: Crusor full-stack once

on:
  push:
    branches:
      - arena/a7c2c868-pulseairepo

permissions:
  contents: write

jobs:
  build-and-grade:
    name: Build and independently grade SprintBoard
    if: contains(github.event.head_commit.message, '[crusor-fullstack-once]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CUSTOM_API_KEY: ${{ secrets.CUSTOM_API_KEY }}
      CUSTOM_BASE_URL: https://velona.in/v1
      LLM_PROVIDER: custom
      LLM_MODEL: z-ai/glm-5.3-flash
      CONTEXT_MODEL: z-ai/glm-5.3-flash
      AUX_LLM_PROVIDER: custom
      AUX_LLM_MODEL: z-ai/glm-5.3-flash
      CRUSORAI_HTTP_USER_AGENT: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36
      CRUSORAI_LLM_STREAMING: 'on'
      CRUSORAI_MEMORY: 'off'
      CRUSORAI_MEMORY_WARMUP_AT_BOOT: 'off'
      CRUSORAI_OTEL: 'off'
      CRUSORAI_WEB_TOOLS: 'off'
      CRUSORAI_MAX_TOOLS: '8'

    steps:
      - name: Check out exact challenge commit
        uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: true

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Normalize secret without exposing it
        run: |
          python - <<'PY'
          import os
          key = (os.environ.get("CUSTOM_API_KEY") or "").strip()
          assert key and "\n" not in key and "\r" not in key
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as stream:
              stream.write(f"CUSTOM_API_KEY={key}\n")
          print("PASS: provider secret normalized in runner memory; value not printed")
          PY

      - name: Install pinned Agent Core runtime
        run: >-
          python -m pip install --disable-pip-version-check
          aiosqlite==0.22.1 ddgs==9.16.1 google-genai==2.33.0
          groq==0.37.1 httpx==0.28.1 langchain==1.4.7
          langchain-google-genai==4.4.2 langchain-groq==1.1.3
          langchain-openai==1.7.3 langgraph==1.2.18
          langgraph-checkpoint-sqlite==3.1.2 mcp==2.3.0
          openai==3.39.0 opentelemetry-api==1.45.1
          opentelemetry-sdk==1.45.1 pillow==13.0.0
          pydantic==2.14.1 python-dotenv==1.2.4 rich==15.0.0
          sqlite-vec==0.1.9 tiktoken==0.14.0 typer==0.27.3 watchdog==6.0.0

      - name: Prepare immutable full-stack acceptance suite
        run: |
          set -euo pipefail
          workspace="$GITHUB_WORKSPACE/showcase/sprintboard"
          rm -rf "$workspace" /tmp/crusor-fullstack-results
          mkdir -p "$workspace/.acceptance"
          cat > "$workspace/.acceptance/test_sprintboard.py" <<'PY'
          from __future__ import annotations

          import json
          import os
          import socket
          import sqlite3
          import subprocess
          import sys
          import tempfile
          import time
          import unittest
          import urllib.error
          import urllib.request
          from pathlib import Path


          ROOT = Path(__file__).resolve().parents[1]


          class SprintBoardAcceptance(unittest.TestCase):
              @classmethod
              def setUpClass(cls):
                  cls.tempdir = tempfile.TemporaryDirectory()
                  cls.db_path = Path(cls.tempdir.name) / "acceptance.db"
                  with socket.socket() as sock:
                      sock.bind(("127.0.0.1", 0))
                      cls.port = sock.getsockname()[1]
                  cls.base = f"http://127.0.0.1:{cls.port}"
                  env = dict(os.environ)
                  env["SPRINTBOARD_DB"] = str(cls.db_path)
                  cls.process = subprocess.Popen(
                      [
                          sys.executable,
                          str(ROOT / "server.py"),
                          "--host", "127.0.0.1",
                          "--port", str(cls.port),
                      ],
                      cwd=ROOT,
                      env=env,
                      stdout=subprocess.PIPE,
                      stderr=subprocess.STDOUT,
                      text=True,
                  )
                  deadline = time.time() + 10
                  last_error = ""
                  while time.time() < deadline:
                      if cls.process.poll() is not None:
                          output = cls.process.stdout.read() if cls.process.stdout else ""
                          raise RuntimeError(f"server exited early: {output[-2000:]}")
                      try:
                          status, payload, _ = cls.request("GET", "/api/health")
                          if status == 200 and payload.get("status") == "ok":
                              return
                      except Exception as exc:
                          last_error = repr(exc)
                      time.sleep(0.1)
                  cls.process.terminate()
                  output = cls.process.communicate(timeout=5)[0]
                  raise RuntimeError(f"server never became ready: {last_error}; {output[-2000:]}")

              @classmethod
              def tearDownClass(cls):
                  if getattr(cls, "process", None) is not None:
                      cls.process.terminate()
                      try:
                          cls.process.communicate(timeout=5)
                      except subprocess.TimeoutExpired:
                          cls.process.kill()
                          cls.process.communicate(timeout=5)
                  if getattr(cls, "tempdir", None) is not None:
                      cls.tempdir.cleanup()

              @classmethod
              def request(cls, method, path, payload=None):
                  body = None if payload is None else json.dumps(payload).encode("utf-8")
                  request = urllib.request.Request(
                      cls.base + path,
                      data=body,
                      method=method,
                      headers={"Content-Type": "application/json"},
                  )
                  try:
                      response = urllib.request.urlopen(request, timeout=5)
                  except urllib.error.HTTPError as exc:
                      response = exc
                  raw = response.read()
                  content_type = response.headers.get("Content-Type", "")
                  parsed = json.loads(raw) if raw and "json" in content_type else {}
                  return response.status, parsed, raw.decode("utf-8", "replace")

              def test_01_required_files_are_substantial(self):
                  minimums = {
                      "server.py": 1000,
                      "index.html": 900,
                      "styles.css": 1200,
                      "app.js": 1200,
                      "README.md": 300,
                  }
                  for name, minimum in minimums.items():
                      path = ROOT / name
                      self.assertTrue(path.is_file(), name)
                      self.assertGreaterEqual(path.stat().st_size, minimum, name)

              def test_02_health_and_frontend_assets(self):
                  status, payload, _ = self.request("GET", "/api/health")
                  self.assertEqual(status, 200)
                  self.assertEqual(payload, {"status": "ok"})

                  status, _, html = self.request("GET", "/")
                  self.assertEqual(status, 200)
                  self.assertIn("SprintBoard", html)
                  self.assertIn('id="task-form"', html)
                  self.assertIn('id="task-list"', html)
                  self.assertIn('id="stat-total"', html)
                  self.assertIn("styles.css", html)
                  self.assertIn("app.js", html)

                  status, _, css = self.request("GET", "/styles.css")
                  self.assertEqual(status, 200)
                  self.assertIn("@media", css)
                  status, _, javascript = self.request("GET", "/app.js")
                  self.assertEqual(status, 200)
                  self.assertIn("fetch(", javascript)
                  self.assertIn("/api/tasks", javascript)
                  self.assertIn("/api/stats", javascript)

              def test_03_rejects_invalid_tasks(self):
                  status, _, _ = self.request("POST", "/api/tasks", {"title": "   "})
                  self.assertEqual(status, 400)
                  status, _, _ = self.request(
                      "POST", "/api/tasks", {"title": "Valid", "priority": "urgent"}
                  )
                  self.assertEqual(status, 400)

              def test_04_crud_stats_and_sqlite_persistence(self):
                  status, created, _ = self.request(
                      "POST",
                      "/api/tasks",
                      {"title": "Ship the launch", "priority": "high"},
                  )
                  self.assertEqual(status, 201)
                  task = created["task"]
                  self.assertIsInstance(task["id"], int)
                  self.assertEqual(task["title"], "Ship the launch")
                  self.assertEqual(task["priority"], "high")
                  self.assertEqual(task["status"], "todo")

                  status, listed, _ = self.request("GET", "/api/tasks")
                  self.assertEqual(status, 200)
                  self.assertIn(task["id"], [item["id"] for item in listed["tasks"]])

                  status, updated, _ = self.request(
                      "PATCH", f"/api/tasks/{task['id']}", {"status": "doing"}
                  )
                  self.assertEqual(status, 200)
                  self.assertEqual(updated["task"]["status"], "doing")

                  status, stats, _ = self.request("GET", "/api/stats")
                  self.assertEqual(status, 200)
                  self.assertGreaterEqual(stats["total"], 1)
                  self.assertGreaterEqual(stats["doing"], 1)
                  self.assertEqual(
                      stats["total"], stats["todo"] + stats["doing"] + stats["done"]
                  )

                  with sqlite3.connect(self.db_path) as connection:
                      row = connection.execute(
                          "SELECT title, priority, status FROM tasks WHERE id = ?",
                          (task["id"],),
                      ).fetchone()
                  self.assertEqual(row, ("Ship the launch", "high", "doing"))

                  status, _, _ = self.request("DELETE", f"/api/tasks/{task['id']}")
                  self.assertEqual(status, 204)
                  status, listed, _ = self.request("GET", "/api/tasks")
                  self.assertNotIn(task["id"], [item["id"] for item in listed["tasks"]])

              def test_05_missing_task_and_bad_status_are_honest(self):
                  status, _, _ = self.request(
                      "PATCH", "/api/tasks/999999", {"status": "done"}
                  )
                  self.assertEqual(status, 404)
                  status, created, _ = self.request(
                      "POST", "/api/tasks", {"title": "Check errors", "priority": "low"}
                  )
                  task_id = created["task"]["id"]
                  status, _, _ = self.request(
                      "PATCH", f"/api/tasks/{task_id}", {"status": "blocked"}
                  )
                  self.assertEqual(status, 400)


          if __name__ == "__main__":
              unittest.main(verbosity=2)
          PY
          sha256sum "$workspace/.acceptance/test_sprintboard.py" | awk '{print $1}' > /tmp/sprintboard-test-hash-before
          cat > /tmp/crusor-fullstack-prompt.txt <<'EOF'
          Build a polished, production-minded full-stack website named SprintBoard in this workspace.

          Use only the Python 3 standard library on the backend and browser-native HTML, CSS, and JavaScript on the frontend. Do not add dependencies and do not modify .acceptance/test_sprintboard.py.

          This is a fresh file-delivery workspace. On your first action, use the dedicated write_file tool to land a real baseline application file. Batch independent write_file calls when available. Use write_file/edit_file for all source changes; do not use terminal shell redirection, heredocs, Python one-liners, or diagnostics scripts to create application files. Reserve terminal for running verification after files exist.

          Deliver exactly these application files at the workspace root:
          - server.py
          - index.html
          - styles.css
          - app.js
          - README.md

          Backend requirements:
          - A ThreadingHTTPServer-based app, runnable as `python server.py --host HOST --port PORT`.
          - SQLite persistence. Honor SPRINTBOARD_DB when set; otherwise use tasks.db beside server.py.
          - GET /api/health returns exactly {"status":"ok"}.
          - GET /api/tasks returns {"tasks":[...]}, newest first.
          - POST /api/tasks validates a nonblank title and priority low/medium/high, creates status todo, and returns 201 with {"task":...}.
          - PATCH /api/tasks/{id} validates status todo/doing/done, returns the updated task, and returns 404 for an unknown id.
          - DELETE /api/tasks/{id} returns 204 and actually deletes the row.
          - GET /api/stats returns integer total/todo/doing/done counts.
          - Serve index.html at / and the CSS/JS assets at /styles.css and /app.js with appropriate content types.
          - Return useful JSON errors and never expose a traceback to the client.

          Frontend requirements:
          - A genuinely polished, responsive dashboard—not a bare test fixture.
          - Strong visual hierarchy, an intentional color system, cards, responsive layout, hover/focus states, and at least one subtle animation.
          - Header/brand plus API health indicator.
          - Four live statistic cards for total, todo, doing, and done.
          - Accessible add-task form with title and priority controls.
          - All/Todo/Doing/Done filters, loading/empty/error states, task cards, status controls, and delete actions.
          - Use the real REST API with fetch; no hardcoded sample tasks.
          - Preserve the required DOM ids used by the acceptance suite.

          README.md must explain features, architecture, data model, launch command, API routes, and verification command.

          Work autonomously. After the first application file exists, inspect the immutable acceptance test. Implement the complete site, run `python -m unittest discover -s .acceptance -p 'test_*.py' -v`, fix every failure, reread the final implementation, and finish with a concise evidence-based report. Do not inspect unrelated repository paths.
          EOF

      - name: Run genuine Crusor Agent Core full-stack task
        id: crusor_task
        continue-on-error: true
        run: |
          set -uo pipefail
          date +%s > /tmp/crusor-fullstack-started
          set +e
          python scripts/run_bridge_turn.py \
            --workspace "$GITHUB_WORKSPACE/showcase/sprintboard" \
            --prompt-file /tmp/crusor-fullstack-prompt.txt \
            --run-id "fullstack-${GITHUB_RUN_ID}" \
            --timeout-s 600 \
            --max-llm-calls 12 \
            --max-input-tokens 250000 \
            --max-no-delivery-calls 0 \
            --results-root /tmp/crusor-fullstack-results
          status=$?
          date +%s > /tmp/crusor-fullstack-finished
          exit "$status"

      - name: Independently grade full-stack delivery
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path

          workspace = Path(os.environ["GITHUB_WORKSPACE"]) / "showcase" / "sprintboard"
          run_dir = Path("/tmp/crusor-fullstack-results") / f"fullstack-{os.environ['GITHUB_RUN_ID']}"
          try:
              outcome = json.loads((run_dir / "outcome.json").read_text(encoding="utf-8"))
          except Exception as exc:
              outcome = {"result": "missing-outcome", "completed": False, "error": type(exc).__name__}
          try:
              frames = [
                  json.loads(line)
                  for line in (run_dir / "frames.jsonl").read_text(encoding="utf-8").splitlines()
                  if line.strip()
              ]
          except Exception:
              frames = []

          test_run = subprocess.run(
              [
                  "python", "-m", "unittest", "discover",
                  "-s", ".acceptance", "-p", "test_*.py", "-v",
              ],
              cwd=workspace,
              text=True,
              stdout=subprocess.PIPE,
              stderr=subprocess.STDOUT,
              timeout=90,
          )
          test_output = test_run.stdout[-5000:]
          digest = lambda path: hashlib.sha256(path.read_bytes()).hexdigest() if path.is_file() else ""
          before_hash = Path("/tmp/sprintboard-test-hash-before").read_text().strip()
          after_hash = digest(workspace / ".acceptance" / "test_sprintboard.py")
          expected = ["server.py", "index.html", "styles.css", "app.js", "README.md"]
          expected_paths = [workspace / name for name in expected]
          allowed_top_level = set(expected) | {
              ".acceptance", "tasks.db", "__pycache__", "diagnostics",
          }
          unexpected = sorted(
              path.name for path in workspace.iterdir()
              if path.name not in allowed_top_level and not path.name.startswith(".")
          ) if workspace.is_dir() else ["workspace-missing"]
          symlinks = [path.name for path in workspace.rglob("*") if path.is_symlink()] if workspace.is_dir() else []
          total_bytes = sum(path.stat().st_size for path in expected_paths if path.is_file())
          key = (os.environ.get("CUSTOM_API_KEY") or "").strip()
          secret_absent = bool(key) and all(
              key.encode() not in path.read_bytes() for path in expected_paths if path.is_file()
          )
          reserve_frames = [
              frame for frame in frames
              if frame.get("type") == "context_status"
              and frame.get("phase") == "final_response_reserve"
          ]
          tool_names = [
              str(frame.get("name") or frame.get("tool_name") or "unknown")
              for frame in frames if frame.get("type") == "tool_call_start"
          ]
          calls = int(outcome.get("llm_request_frames") or 0)
          completed = outcome.get("completed") is True
          completion_handoff = completed and (calls < 12 or bool(reserve_frames))
          started = int(Path("/tmp/crusor-fullstack-started").read_text().strip())
          finished = int(Path("/tmp/crusor-fullstack-finished").read_text().strip())
          checks = {
              "turn_done": outcome.get("result") == "turn_done",
              "completed": completed,
              "completion_handoff": completion_handoff,
              "aligned_iteration_budget": outcome.get("agent_iteration_budget") == 12,
              "acceptance_suite_passed": test_run.returncode == 0 and "Ran 5 tests" in test_output and "OK" in test_output,
              "tests_immutable": bool(before_hash) and before_hash == after_hash,
              "all_application_files_present": all(path.is_file() and path.stat().st_size > 0 for path in expected_paths),
              "no_unexpected_files": not unexpected,
              "no_symlinks": not symlinks,
              "bounded_delivery_size": 4500 <= total_bytes <= 300000,
              "provider_secret_absent": secret_absent,
              "tool_execution_observed": bool(tool_names),
              "first_delivery_is_write_file": tool_names[:1] == ["write_file"],
              "agent_verification_observed": any(
                  name in {"terminal", "run_terminal"} for name in tool_names
              ),
              "telemetry_observed": int(outcome.get("tokens_in_last_telemetry") or 0) > 0,
              "within_call_bound": 0 < calls <= 12,
              "within_token_bound": int(outcome.get("tokens_in_last_telemetry") or 0) <= 250000,
              "no_budget_stop": not bool(outcome.get("budget_stop")),
          }
          passed = all(checks.values())
          receipt = {
              "status": "passed" if passed else "failed",
              "provider": "custom",
              "model": "z-ai/glm-5.3-flash",
              "commit": os.environ["GITHUB_SHA"],
              "checks": checks,
              "result": outcome.get("result"),
              "completed": outcome.get("completed"),
              "elapsed_seconds": max(0, finished - started),
              "agent_iteration_budget": outcome.get("agent_iteration_budget"),
              "llm_request_frames": calls,
              "tokens_in_last_telemetry": outcome.get("tokens_in_last_telemetry"),
              "final_response_reserve_frames": len(reserve_frames),
              "completion_evidence_ready": reserve_frames[-1].get("completion_evidence_ready") if reserve_frames else None,
              "frame_counts": outcome.get("frame_counts"),
              "tool_sequence": tool_names,
              "application_bytes": total_bytes,
              "unexpected_files": unexpected,
              "symlinks": symlinks,
              "test_returncode": test_run.returncode,
              "test_summary": [
                  line for line in test_output.splitlines()
                  if line.startswith("Ran ") or line == "OK" or line.startswith("FAILED")
              ],
              "api_key_persisted": False,
          }
          compact = json.dumps(receipt, sort_keys=True, separators=(",", ":"))
          level = "notice" if passed else "error"
          print(f"::{level} file=showcase/sprintboard/server.py,title=Crusor full-stack receipt::{compact}")
          print("--- independent acceptance tail ---")
          print(test_output)
          Path(os.environ["GITHUB_STEP_SUMMARY"]).write_text(
              "## Crusor full-stack benchmark\n\n```json\n"
              + json.dumps(receipt, indent=2, sort_keys=True)
              + "\n```\n",
              encoding="utf-8",
          )
          if passed:
              Path("/tmp/crusor-fullstack-grade-passed").write_text("passed\n")
          raise SystemExit(0 if passed else 1)
          PY

      - name: Commit only the independently verified Crusor site
        run: |
          set -euo pipefail
          test -f /tmp/crusor-fullstack-grade-passed
          workspace="$GITHUB_WORKSPACE/showcase/sprintboard"
          rm -f "$workspace/tasks.db"
          rm -rf "$workspace/.acceptance" "$workspace/diagnostics" "$workspace/__pycache__"
          python - <<'PY'
          import os
          from pathlib import Path
          root = Path(os.environ["GITHUB_WORKSPACE"]) / "showcase" / "sprintboard"
          expected = {"server.py", "index.html", "styles.css", "app.js", "README.md"}
          assert {path.name for path in root.iterdir()} == expected
          key = (os.environ.get("CUSTOM_API_KEY") or "").strip().encode()
          assert key
          for path in root.iterdir():
              assert path.is_file() and not path.is_symlink()
              assert key not in path.read_bytes()
          print("PASS: commit allowlist and secret scan")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f -- \
            showcase/sprintboard/server.py \
            showcase/sprintboard/index.html \
            showcase/sprintboard/styles.css \
            showcase/sprintboard/app.js \
            showcase/sprintboard/README.md
          git diff --cached --check
          git diff --cached --quiet && { echo "No generated site to commit"; exit 1; }
          git commit -m "feat(showcase): add Crusor-built SprintBoard full-stack site"
          git push origin HEAD:arena/a7c2c868-pulseairepo
