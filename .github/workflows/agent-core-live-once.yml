name: Agent Core live once

on:
  push:
    branches:
      - arena/a7c2c868-pulseairepo

permissions:
  contents: read

jobs:
  bounded-agent-core:
    name: Bounded custom-provider Agent Core turn
    if: contains(github.event.head_commit.message, '[agent-core-live-once]')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CUSTOM_API_KEY: ${{ secrets.CUSTOM_API_KEY }}
      CUSTOM_BASE_URL: https://velona.in/v1
      LLM_PROVIDER: custom
      LLM_MODEL: z-ai/glm-5.3-flash
      CONTEXT_MODEL: z-ai/glm-5.3-flash
      AUX_LLM_PROVIDER: custom
      AUX_LLM_MODEL: z-ai/glm-5.3-flash
      CRUSORAI_HTTP_USER_AGENT: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36
      CRUSORAI_LLM_STREAMING: 'on'
      CRUSORAI_MEMORY: 'off'
      CRUSORAI_MEMORY_WARMUP_AT_BOOT: 'off'
      CRUSORAI_OTEL: 'off'
      CRUSORAI_WEB_TOOLS: 'off'

    steps:
      - name: Check out the exact triggering commit
        uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Normalize secret and verify generic route without exposing it
        run: |
          python - <<'PY'
          import os
          raw = os.environ.get("CUSTOM_API_KEY") or ""
          key = raw.strip()
          assert key, "CUSTOM_API_KEY repository secret is unavailable"
          assert "\n" not in key and "\r" not in key, "CUSTOM_API_KEY contains an internal newline"
          assert os.environ.get("LLM_PROVIDER") == "custom"
          assert os.environ.get("LLM_MODEL") == "z-ai/glm-5.3-flash"
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as stream:
              stream.write(f"CUSTOM_API_KEY={key}\n")
          print("PASS: custom/z-ai/glm-5.3-flash route; normalized secret exported (value not printed)")
          PY

      - name: Install pinned Agent Core runtime
        run: >-
          python -m pip install --disable-pip-version-check
          aiosqlite==0.22.1 ddgs==9.16.1 google-genai==2.33.0
          groq==0.37.1 httpx==0.28.1 langchain==1.4.7
          langchain-google-genai==4.4.2 langchain-groq==1.1.3
          langchain-openai==1.7.3 langgraph==1.2.18
          langgraph-checkpoint-sqlite==3.1.2 mcp==2.3.0
          openai==3.39.0 opentelemetry-api==1.45.1
          opentelemetry-sdk==1.45.1 pillow==13.0.0
          pydantic==2.14.1 python-dotenv==1.2.4 rich==15.0.0
          sqlite-vec==0.1.9 tiktoken==0.14.0 typer==0.27.3 watchdog==6.0.0

      - name: Confirm a non-empty Velona response through PulseAI factory
        env:
          CRUSORAI_LLM_STREAMING: 'off'
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          from src.llm.factory import get_llm

          reply = get_llm(
              "custom",
              "z-ai/glm-5.3-flash",
              max_attempts=1,
              request_timeout=30.0,
          ).invoke("Reply with only READY.")
          content = getattr(reply, "content", reply)
          if isinstance(content, list):
              content = "".join(
                  str(part.get("text") or "") if isinstance(part, dict) else str(part)
                  for part in content
              )
          text = str(content or "").strip()
          assert text, "Velona returned no response text"
          receipt = {
              "response_observed": True,
              "response_characters": len(text),
              "response_sha256": hashlib.sha256(text.encode()).hexdigest(),
          }
          Path("/tmp/velona-response.json").write_text(json.dumps(receipt), encoding="utf-8")
          print(f"::notice title=Velona response::non-empty response received ({len(text)} characters; content not printed)")
          PY

      - name: Run one bounded genuine Agent Core turn
        id: live_turn
        continue-on-error: true
        run: |
          set -euo pipefail
          workspace=/tmp/pulseai-agent-core-live
          results=/tmp/pulseai-agent-core-results
          prompt=/tmp/pulseai-agent-core-prompt.txt
          rm -rf "$workspace" "$results"
          mkdir -p "$workspace"
          cat > "$prompt" <<'EOF'
          Create a file named live-agent-core-proof.txt in the workspace containing exactly:
          VELONA_AGENT_CORE_OK
          Verify the file, then finish with a concise confirmation. Do not inspect unrelated paths.
          EOF
          python scripts/run_bridge_turn.py \
            --workspace "$workspace" \
            --prompt-file "$prompt" \
            --run-id "live-${GITHUB_RUN_ID}" \
            --timeout-s 300 \
            --max-llm-calls 5 \
            --max-input-tokens 60000 \
            --max-no-delivery-calls 3 \
            --results-root "$results"

      - name: Grade sanitized live evidence
        if: always()
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          outcome_path = Path("/tmp/pulseai-agent-core-results") / f"live-{os.environ['GITHUB_RUN_ID']}" / "outcome.json"
          proof_path = Path("/tmp/pulseai-agent-core-live/live-agent-core-proof.txt")
          probe_path = Path("/tmp/velona-response.json")
          try:
              outcome = json.loads(outcome_path.read_text(encoding="utf-8"))
          except Exception as exc:
              outcome = {"result": "missing-outcome", "completed": False, "error": type(exc).__name__}
          try:
              probe = json.loads(probe_path.read_text(encoding="utf-8"))
          except Exception:
              probe = {"response_observed": False, "response_characters": 0}
          proof_exact = proof_path.is_file() and proof_path.read_text(encoding="utf-8").strip() == "VELONA_AGENT_CORE_OK"
          checks = {
              "velona_response_observed": probe.get("response_observed") is True,
              "turn_done": outcome.get("result") == "turn_done",
              "completed": outcome.get("completed") is True,
              "llm_request_observed": int(outcome.get("llm_request_frames") or 0) >= 1,
              "proof_file_exact": proof_exact,
              "within_call_bound": int(outcome.get("llm_request_frames") or 0) <= 5,
              "no_budget_stop": not bool(outcome.get("budget_stop")),
              "no_delivery_stop": not bool(outcome.get("no_delivery_stop")),
          }
          passed = all(checks.values())
          receipt = {
              "status": "passed" if passed else "failed",
              "provider": "custom",
              "model": "z-ai/glm-5.3-flash",
              "commit": os.environ["GITHUB_SHA"],
              "checks": checks,
              "result": outcome.get("result"),
              "completed": outcome.get("completed"),
              "endpoint_response_characters": probe.get("response_characters"),
              "endpoint_response_sha256": probe.get("response_sha256"),
              "llm_request_frames": outcome.get("llm_request_frames"),
              "frame_counts": outcome.get("frame_counts"),
              "tokens_in_last_telemetry": outcome.get("tokens_in_last_telemetry"),
              "safety_requests": outcome.get("safety_requests"),
              "safety_approved": outcome.get("safety_approved"),
              "api_key_persisted": False,
          }
          compact = json.dumps(receipt, sort_keys=True, separators=(",", ":"))
          level = "notice" if passed else "error"
          print(f"::{level} file=scripts/run_bridge_turn.py,title=Bounded Agent Core live receipt::{compact}")
          summary = Path(os.environ["GITHUB_STEP_SUMMARY"])
          summary.write_text(
              "## Bounded Agent Core live receipt\n\n```json\n"
              + json.dumps(receipt, indent=2, sort_keys=True)
              + "\n```\n",
              encoding="utf-8",
          )
          raise SystemExit(0 if passed else 1)
          PY
