name: E2E agent core (GLM 5.3)

# The only test that runs a REAL model through the REAL graph and then asks
# whether the run can explain itself. The offline suites prove the units; this
# proves the assembled thing.
#
# It builds a deliberately small but complete MVP inside a throwaway workspace,
# then asserts the 2026-10-31 invariants: the turn names how it ended, the step
# trace carries a terminal node, and spend is priced in USD.

on:
  workflow_dispatch:
  push:
    branches: [main, 'arena/**']
    paths:
      - 'tests/e2e/**'
      # src/** IS the point: this test exists to catch a graph/gate change that
      # the offline units still call green. Omitting it meant the run was
      # skipped for the very commits it was written to judge — on 2026-11-01 two
      # gate fixes were pushed and nothing triggered.
      - 'src/**'
      - 'scripts/run_bridge_turn.py'
      - 'scripts/e2e_core_report.py'
      - '.github/workflows/e2e-core.yml'

permissions:
  contents: read
  issues: write

jobs:
  e2e:
    name: Real GLM 5.3 turn -> verified report
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      # Provider: Velona custom OpenAI-compatible gateway.
      LLM_PROVIDER: custom
      LLM_MODEL: z-ai/glm-5.3-flash
      CONTEXT_MODEL: z-ai/glm-5.3-flash
      AUX_LLM_PROVIDER: custom
      AUX_LLM_MODEL: z-ai/glm-5.3-flash
      CUSTOM_BASE_URL: https://velona.in/v1
      # Keep the run hermetic and cheap.
      CRUSORAI_DISABLE_LONG_TERM_MEMORY: '1'
      CRUSORAI_MEMORY: 'off'
      CRUSORAI_PREVIEW_AUTOSTART: '0'
      CRUSORAI_SUBAGENT_DEPTH: '0'
      # Bounded spend: this job must never be able to surprise the wallet.
      AGENT_ITERATION_BUDGET: '20'
      AGENT_COST_BUDGET: '0.25'
      AGENT_COST_TARGET_USD: '0.25'
      # The gateway rejects the OpenAI SDK default UA (Cloudflare).
      CRUSORAI_HTTP_USER_AGENT: >-
        Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36
        (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r /dev/stdin <<'REQ'
          langchain-core
          langgraph
          langgraph-checkpoint-sqlite
          langgraph-prebuilt
          langchain
          langchain-openai
          langchain-google-genai
          langchain-groq
          groq
          google-genai
          copilotkit
          ag-ui-langgraph
          aiosqlite
          sqlite-vec
          watchdog
          tree-sitter
          tree-sitter-javascript
          tree-sitter-typescript
          tree-sitter-go
          tree-sitter-rust
          tree-sitter-java
          httpx
          rich
          typer
          fastapi
          uvicorn
          flask
          flask-cors
          pillow
          mcp
          opentelemetry-api
          opentelemetry-sdk
          opentelemetry-exporter-otlp-proto-http
          ddgs
          tiktoken
          pydantic
          python-dotenv
          REQ

      - name: Prepare an isolated workspace and store
        run: |
          mkdir -p "$RUNNER_TEMP/e2e/ws" "$RUNNER_TEMP/crusorai"
          cp tests/e2e/prompt_mvp.txt "$RUNNER_TEMP/e2e/prompt.txt"
          echo "CRUSORAI_HOME=$RUNNER_TEMP/crusorai" >> "$GITHUB_ENV"
          echo "workspace ready"

      # A secret stored with a trailing newline is a copy-paste artefact, and it
      # poisons the Authorization header: httpx raises LocalProtocolError
      # ("illegal header value") and the SDK reports only "Connection error."
      # after 5 retries. Normalise once here, and report the delta so the
      # stored secret can be fixed at source rather than silently patched.
      - name: Normalise the credential (report whitespace, never print it)
        env:
          RAW_KEY: ${{ secrets.CUSTOM_API_KEY }}
        run: |
          python - <<'PY' | tee "$RUNNER_TEMP/e2e/key-normalise.txt"
          import os
          raw = os.environ.get("RAW_KEY") or ""
          clean = raw.strip()
          print(f"raw_len={len(raw)} clean_len={len(clean)} "
                f"whitespace_stripped={raw != clean}")
          if raw != clean:
              print("WARNING: the stored secret carries surrounding whitespace; "
                    "re-set it with: printf '%s' "$KEY" | gh secret set CUSTOM_API_KEY")
          with open(os.environ["GITHUB_ENV"], "a") as fh:
              fh.write(f"CUSTOM_API_KEY={clean}\n")
          PY

      - name: SDK connectivity probe (isolates transport from agent logic)
        env:
          CUSTOM_API_KEY: ${{ secrets.CUSTOM_API_KEY }}
        run: |
          set -o pipefail
          python - <<'PY' 2>&1 | tee "$RUNNER_TEMP/e2e/probe.txt"
          import os, traceback
          print("base_url=", os.environ.get("CUSTOM_BASE_URL"))
          print("model   =", os.environ.get("LLM_MODEL"))
          k = (os.environ.get("CUSTOM_API_KEY") or "").strip()
          print("key     = len=%d ...%s (stripped)" % (len(k), k[-4:]))
          try:
              from langchain_openai import ChatOpenAI
              llm = ChatOpenAI(
                  api_key=k,
                  base_url=os.environ["CUSTOM_BASE_URL"],
                  model=os.environ["LLM_MODEL"],
                  max_retries=0,
                  request_timeout=45,
                  default_headers={"User-Agent": os.environ["CRUSORAI_HTTP_USER_AGENT"]},
              )
              r = llm.invoke("reply with the single word: ok")
              print("SDK PROBE OK:", str(r.content)[:80])
          except Exception as exc:
              print("SDK PROBE FAILED:", type(exc).__name__, str(exc)[:400])
              traceback.print_exc()
          PY

      - name: Pricing probe (can this model be cost-tracked at all?)
        env:
          CUSTOM_API_KEY: ${{ secrets.CUSTOM_API_KEY }}
        run: |
          python - <<'PY' 2>&1 | tee "$RUNNER_TEMP/e2e/pricing.txt"
          import json
          from src.telemetry.call_ledger import load_rate_card, estimate_cost_usd
          from src.telemetry import pricing
          try:
              pricing.ensure_pricing_async()
              import time; time.sleep(8)   # opportunistic refresh is non-blocking
          except Exception as exc:
              print("pricing refresh failed:", type(exc).__name__, exc)
          card = load_rate_card() or {}
          print(f"rate card entries: {len(card)}")
          for m in ("z-ai/glm-5.3-flash", "deepseek/deepseek-v4.1-flash"):
              print(f"  {m}: {estimate_cost_usd(m, 1_000_000, 0)}")
          if not card:
              print("RATE CARD EMPTY -> cost cannot be measured for ANY model; "
                    "set CRUSORAI_RATE_CARD (JSON) to enable the USD budget leg")
              # Make the gap actionable instead of a shrug: dump one catalog
              # entry verbatim so the next person can see whether the gateway
              # publishes prices at all, or publishes them under keys that
              # pricing.py does not parse. Never printed: the key.
              try:
                  from src.telemetry.pricing import candidate_urls
                  import os, urllib.request
                  base = (os.environ.get("CUSTOM_BASE_URL")
                          or os.environ.get("CRUSORAI_PRICING_BASE_URL") or "").rstrip("/")
                  urls = candidate_urls(base) if base else []
                  if not urls:
                      print("no CUSTOM_BASE_URL / CRUSORAI_PRICING_BASE_URL set")
                  key = (os.environ.get("CUSTOM_API_KEY") or "").strip()
                  print("catalog candidates:", len(urls))
                  for url in urls[:3]:
                      try:
                          req = urllib.request.Request(url, headers={"Authorization": f"Bearer {key}"})
                          with urllib.request.urlopen(req, timeout=15) as resp:
                              payload = json.loads(resp.read().decode("utf-8", "replace"))
                          data = payload.get("data") if isinstance(payload, dict) else None
                          first = (data or [{}])[0] if isinstance(data, list) else {}
                          print(f"  {url} -> HTTP {resp.status}, {len(data or [])} entries")
                          print("  first entry keys:", sorted(first)[:14])
                          print("  first entry:", json.dumps(first)[:500])
                          break
                      except Exception as exc:
                          print(f"  {url} -> {type(exc).__name__}: {str(exc)[:160]}")
              except Exception as exc:
                  print("catalog dump failed:", type(exc).__name__, str(exc)[:160])
          PY

      - name: Run one real GLM 5.3 turn through the bridge
        env:
          CUSTOM_API_KEY: ${{ secrets.CUSTOM_API_KEY }}
        run: |
          set +e
          python scripts/run_bridge_turn.py \
            --workspace "$RUNNER_TEMP/e2e/ws" \
            --prompt-file "$RUNNER_TEMP/e2e/prompt.txt" \
            --run-id "e2e-glm53-${{ github.run_id }}" \
            --timeout-s 900 \
            --max-llm-calls 20 \
            --max-input-tokens 600000 \
            --results-root "$RUNNER_TEMP/e2e/results" 2>&1 | tee runner.log
          echo "RUNNER_EXIT=${PIPESTATUS[0]}" >> "$GITHUB_ENV"
          # The CLI flag above WINS over AGENT_TOKEN_BUDGET (run_bridge_turn
          # writes env["AGENT_TOKEN_BUDGET"] = effective_max_input_tokens), so
          # the previous 600k env var was decorative beside a 150k wall — and a
          # healthy MVP build was cut at iteration 6 of 20 for it.
          # Copy the log next to the frames so the report can name the budget
          # that actually tripped instead of printing a bare "budget_exhausted".
          cp runner.log "$RUNNER_TEMP/e2e/results/e2e-glm53-${{ github.run_id }}/runner.log" 2>/dev/null || true
          # Capture the outcome explanation HERE, where runner.log provably is,
          # and echo it so the step log carries it too.
          grep -E -e 'finalize ' -e '\[budget\]' -e '\[grace\]' -e 'turn end:' runner.log \
            > "$RUNNER_TEMP/e2e/decision.txt" 2>/dev/null || true
          echo "=== outcome explanation ==="
          cut -c1-400 "$RUNNER_TEMP/e2e/decision.txt" 2>/dev/null | head -12

      - name: Show what the agent actually built
        if: always()
        run: |
          echo "=== workspace tree ==="
          find "$RUNNER_TEMP/e2e/ws" -type f -not -path '*/.git/*' | sort | head -40
          echo
          echo "=== line counts ==="
          find "$RUNNER_TEMP/e2e/ws" -name '*.py' -o -name '*.html' -o -name '*.css' \
            | xargs -r wc -l 2>/dev/null | tail -12
          {
            echo "files:"
            find "$RUNNER_TEMP/e2e/ws" -type f -not -path '*/.git/*' -printf '  %P\n' | sort | head -20
            echo
            find "$RUNNER_TEMP/e2e/ws" \( -name '*.py' -o -name '*.html' -o -name '*.css' \) \
              -exec wc -l {} + 2>/dev/null | tail -8
          } > "$RUNNER_TEMP/e2e/workspace.txt" 2>&1 || true

      - name: Verify the deliverable independently of the agent
        if: always()
        run: |
          set +e
          WS="$RUNNER_TEMP/e2e/ws"
          V="$RUNNER_TEMP/e2e/verify.txt"
          : > "$V"
          say() { echo "$@" | tee -a "$V"; }

          say "=== independent re-test (NOT the agent's own claim) ==="

          # 1. Does the agent's own test file pass when WE run it?
          if [ -f "$WS/mvp/test_server.py" ]; then
            OUT=$( cd "$WS" && timeout 120 python mvp/test_server.py 2>&1 ); RC=$?
            say "agent test file: python mvp/test_server.py -> exit $RC"
            echo "$OUT" | tail -8 | sed 's/^/    /' | tee -a "$V"
            AGENT_TEST_EXIT=$RC
          else
            say "agent test file: MISSING (mvp/test_server.py not written)"
            AGENT_TEST_EXIT=127
          fi

          # 2. Static sanity of every promised file.
          for f in mvp/server.py mvp/index.html mvp/styles.css mvp/test_server.py; do
            if [ -f "$WS/$f" ]; then
              say "file $f: present ($(wc -l < "$WS/$f") lines)"
            else
              say "file $f: MISSING"
            fi
          done
          ( cd "$WS" && python -c "import ast; ast.parse(open('mvp/server.py').read()); print('server.py parses')" ) 2>&1 | sed 's/^/    /' | tee -a "$V"

          # 3. The real contract: start THEIR server and hit /api/health.
          #    A file that parses is not a server that serves; only an HTTP 200
          #    with {"status":"ok"} proves the MVP the prompt asked for.
          if [ -f "$WS/mvp/server.py" ]; then
            ( cd "$WS" && timeout 60 python mvp/server.py >/tmp/srv.log 2>&1 ) &
            SRV=$!
            OK=0
            for _ in $(seq 1 40); do
              sleep 0.5
              CODE=$(curl -s -o /tmp/health.json -w '%{http_code}' --max-time 2 http://127.0.0.1:8137/api/health 2>/dev/null)
              if [ "$CODE" = "200" ]; then OK=1; break; fi
            done
            say "live HTTP /api/health -> ${CODE:-no-response}"
            say "health body: $(head -c 200 /tmp/health.json 2>/dev/null)"
            if [ "$OK" = "1" ] && python -c "import json,sys; sys.exit(0 if json.load(open('/tmp/health.json')).get('status')=='ok' else 1)" 2>/dev/null; then
              say "LIVE CONTRACT: PASS (HTTP 200 + status=ok)"
              LIVE_EXIT=0
            else
              say "LIVE CONTRACT: FAIL"
              tail -5 /tmp/srv.log 2>/dev/null | sed 's/^/    /' | tee -a "$V"
              LIVE_EXIT=1
            fi
            kill $SRV 2>/dev/null; wait $SRV 2>/dev/null
          else
            say "LIVE CONTRACT: FAIL (no server.py)"
            LIVE_EXIT=1
          fi

          # 4. Does index.html actually reference the health element the
          #    prompt demanded (id="health") and fetch the API?
          if [ -f "$WS/mvp/index.html" ]; then
            say "index.html references /api/health: $(grep -c 'api/health' "$WS/mvp/index.html")"
            say "index.html has element id=health: $(grep -c 'id="health"\|id=health' "$WS/mvp/index.html")"
          fi

          echo "AGENT_TEST_EXIT=$AGENT_TEST_EXIT" >> "$GITHUB_ENV"
          echo "LIVE_EXIT=$LIVE_EXIT" >> "$GITHUB_ENV"
          if [ "$AGENT_TEST_EXIT" = "0" ] && [ "$LIVE_EXIT" = "0" ]; then
            say "DELIVERABLE VERDICT: PASS (independent)"
          else
            say "DELIVERABLE VERDICT: FAIL (independent)"
          fi

      - name: E2E core report (invariants I1-I4)
        if: always()
        run: |
          set +e
          python scripts/e2e_core_report.py \
            --run-dir "$RUNNER_TEMP/e2e/results/e2e-glm53-${{ github.run_id }}" \
            --model-label "z-ai/glm-5.3-flash" \
            --require-completed \
            --out "$RUNNER_TEMP/e2e/E2E_CORE_REPORT.md"
          echo "REPORT_EXIT=$?" >> "$GITHUB_ENV"
          exit 0

      - name: Post the report to the tracking issue
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE: '28'
        run: |
          set -euo pipefail
          REPORT=$(cat "$RUNNER_TEMP/e2e/E2E_CORE_REPORT.md" 2>/dev/null | head -60 || echo "no report")
          # Both of these are where a transport failure explains itself, and
          # Actions logs are not reachable from every environment.
          KEYNOTE=$(cat "$RUNNER_TEMP/e2e/key-normalise.txt" 2>/dev/null || echo "no key note")
          PRICING=$(tail -c 900 "$RUNNER_TEMP/e2e/pricing.txt" 2>/dev/null || echo "no pricing output")
          BUILT=$(cat "$RUNNER_TEMP/e2e/workspace.txt" 2>/dev/null | head -25 || echo "no workspace listing")
          VERIFY=$(cat "$RUNNER_TEMP/e2e/verify.txt" 2>/dev/null | head -40 || echo "no independent verification output")
          # The stderr tail is truncated to ~900 bytes, so the one line that
          # explains the outcome could scroll out. Grep it deliberately.
          DECISION=$(cut -c1-400 "$RUNNER_TEMP/e2e/decision.txt" 2>/dev/null | head -12)
          if [ -z "$DECISION" ]; then
            DECISION="no finalize lines captured; runner.log=$(ls -l runner.log 2>&1 | head -1) pwd=$(pwd)"
          fi
          PROBE=$(tail -c 1200 "$RUNNER_TEMP/e2e/probe.txt" 2>/dev/null || echo "no probe output")
          STDERR=$(tail -c 1500 "$RUNNER_TEMP/e2e/results/e2e-glm53-${{ github.run_id }}/bridge_stderr.log" 2>/dev/null || echo "no bridge stderr")
          REPORT=$(printf '%s\n\n### why the turn ended\n```\n%s\n```\n\n### independent re-test of the deliverable\n```\n%s\n```\n\n### what the agent actually wrote\n```\n%s\n```\n\n### credential\n```\n%s\n```\n\n### pricing\n```\n%s\n```\n\n### SDK probe\n```\n%s\n```\n\n### bridge stderr (tail)\n```\n%s\n```' \
            "$REPORT" "$DECISION" "$VERIFY" "$BUILT" "$KEYNOTE" "$PRICING" "$PROBE" "$STDERR")
          BODY=$(printf '**E2E agent core — GLM 5.3** `%s` @ `%s`\nrunner_exit=%s\n\n%s\n' \
            "$GITHUB_WORKFLOW" "${GITHUB_SHA:0:8}" "${RUNNER_EXIT:-unknown}" "$REPORT")
          printf '%s' "$BODY" > body.md
          gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE/comments" -F body=@body.md > /dev/null \
            && echo "report posted" || echo "post skipped"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-glm53-evidence
          path: |
            ${{ runner.temp }}/e2e/E2E_CORE_REPORT.md
            ${{ runner.temp }}/e2e/results/**/frames.jsonl
            ${{ runner.temp }}/e2e/results/**/outcome.json
            ${{ runner.temp }}/crusorai/traces/*.jsonl
          if-no-files-found: warn
