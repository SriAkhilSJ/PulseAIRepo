name: E2E agent core (GLM 5.3)

# The only test that runs a REAL model through the REAL graph and then asks
# whether the run can explain itself. The offline suites prove the units; this
# proves the assembled thing.
#
# It builds a deliberately small but complete MVP inside a throwaway workspace,
# then asserts the 2026-10-31 invariants: the turn names how it ended, the step
# trace carries a terminal node, and spend is priced in USD.

on:
  workflow_dispatch:
  push:
    branches: [main, 'arena/**']
    paths:
      - 'tests/e2e/**'
      # src/** IS the point: this test exists to catch a graph/gate change that
      # the offline units still call green. Omitting it meant the run was
      # skipped for the very commits it was written to judge — on 2026-11-01 two
      # gate fixes were pushed and nothing triggered.
      - 'src/**'
      - 'scripts/run_bridge_turn.py'
      - 'scripts/e2e_core_report.py'
      - '.github/workflows/e2e-core.yml'

permissions:
  contents: read
  issues: write

jobs:
  e2e:
    # A targeted continuous benchmark uses the separate isolated job below;
    # never run both paid jobs for the same push.
    if: ${{ !contains(github.event.head_commit.message, '[continuous-benchmark]') && !contains(github.event.head_commit.message, '[collect-evidence:') }}
    name: Real GLM 5.3 turn -> verified report
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      # Provider: Velona custom OpenAI-compatible gateway.
      LLM_PROVIDER: custom
      LLM_MODEL: z-ai/glm-5.3-flash
      CONTEXT_MODEL: z-ai/glm-5.3-flash
      AUX_LLM_PROVIDER: custom
      AUX_LLM_MODEL: z-ai/glm-5.3-flash
      CUSTOM_BASE_URL: https://velona.in/v1
      # Keep the run hermetic and cheap.
      CRUSORAI_DISABLE_LONG_TERM_MEMORY: '1'
      CRUSORAI_MEMORY: 'off'
      CRUSORAI_PREVIEW_AUTOSTART: '0'
      CRUSORAI_SUBAGENT_DEPTH: '0'
      # Bounded spend: this job must never be able to surprise the wallet.
      AGENT_ITERATION_BUDGET: '20'
      AGENT_COST_BUDGET: '0.25'
      AGENT_COST_TARGET_USD: '0.25'
      # The gateway rejects the OpenAI SDK default UA (Cloudflare).
      CRUSORAI_HTTP_USER_AGENT: >-
        Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36
        (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r /dev/stdin <<'REQ'
          langchain-core
          langgraph
          langgraph-checkpoint-sqlite
          langgraph-prebuilt
          langchain
          langchain-openai
          langchain-google-genai
          langchain-groq
          groq
          google-genai
          copilotkit
          ag-ui-langgraph
          aiosqlite
          sqlite-vec
          watchdog
          tree-sitter
          tree-sitter-javascript
          tree-sitter-typescript
          tree-sitter-go
          tree-sitter-rust
          tree-sitter-java
          httpx
          rich
          typer
          fastapi
          uvicorn
          flask
          flask-cors
          pillow
          mcp
          opentelemetry-api
          opentelemetry-sdk
          opentelemetry-exporter-otlp-proto-http
          ddgs
          tiktoken
          pydantic
          python-dotenv
          REQ

      - name: Prepare an isolated workspace and store
        run: |
          mkdir -p "$RUNNER_TEMP/e2e/ws" "$RUNNER_TEMP/crusorai"
          cp tests/e2e/prompt_mvp.txt "$RUNNER_TEMP/e2e/prompt.txt"
          echo "CRUSORAI_HOME=$RUNNER_TEMP/crusorai" >> "$GITHUB_ENV"
          echo "workspace ready"

      # A secret stored with a trailing newline is a copy-paste artefact, and it
      # poisons the Authorization header: httpx raises LocalProtocolError
      # ("illegal header value") and the SDK reports only "Connection error."
      # after 5 retries. Normalise once here, and report the delta so the
      # stored secret can be fixed at source rather than silently patched.
      - name: Normalise the credential (report whitespace, never print it)
        env:
          RAW_KEY: ${{ secrets.CUSTOM_API_KEY }}
        run: |
          python - <<'PY' | tee "$RUNNER_TEMP/e2e/key-normalise.txt"
          import os
          raw = os.environ.get("RAW_KEY") or ""
          clean = raw.strip()
          print(f"raw_len={len(raw)} clean_len={len(clean)} "
                f"whitespace_stripped={raw != clean}")
          if raw != clean:
              print("WARNING: the stored secret carries surrounding whitespace; "
                    "re-set it with: printf '%s' "$KEY" | gh secret set CUSTOM_API_KEY")
          with open(os.environ["GITHUB_ENV"], "a") as fh:
              fh.write(f"CUSTOM_API_KEY={clean}\n")
          PY

      - name: SDK connectivity probe (isolates transport from agent logic)
        env:
          CUSTOM_API_KEY: ${{ secrets.CUSTOM_API_KEY }}
        run: |
          set -o pipefail
          python - <<'PY' 2>&1 | tee "$RUNNER_TEMP/e2e/probe.txt"
          import os, traceback
          print("base_url=", os.environ.get("CUSTOM_BASE_URL"))
          print("model   =", os.environ.get("LLM_MODEL"))
          k = (os.environ.get("CUSTOM_API_KEY") or "").strip()
          print("key     = len=%d ...%s (stripped)" % (len(k), k[-4:]))
          try:
              from langchain_openai import ChatOpenAI
              llm = ChatOpenAI(
                  api_key=k,
                  base_url=os.environ["CUSTOM_BASE_URL"],
                  model=os.environ["LLM_MODEL"],
                  max_retries=0,
                  request_timeout=45,
                  default_headers={"User-Agent": os.environ["CRUSORAI_HTTP_USER_AGENT"]},
              )
              r = llm.invoke("reply with the single word: ok")
              print("SDK PROBE OK:", str(r.content)[:80])
          except Exception as exc:
              print("SDK PROBE FAILED:", type(exc).__name__, str(exc)[:400])
              traceback.print_exc()
          PY

      - name: Pricing probe (can this model be cost-tracked at all?)
        env:
          CUSTOM_API_KEY: ${{ secrets.CUSTOM_API_KEY }}
        run: |
          python - <<'PY' 2>&1 | tee "$RUNNER_TEMP/e2e/pricing.txt"
          import os, re, time
          from src.telemetry.call_ledger import load_rate_card, estimate_cost_usd

          # A urllib header error quotes the header VALUE back at you:
          #   Invalid header value b'Bearer key_live_...\n'
          # so printing str(exc) prints the credential — which is exactly how a
          # key reached a public issue comment on 2026-11-01. This file is
          # folded into a PUBLIC verdict, so scrub at the print boundary.
          def scrub(text) -> str:
              return re.sub(
                  r"key_live_[A-Za-z0-9_]+",
                  lambda m: f"<REDACTED len={len(m.group(0))} \u2026{m.group(0)[-4:]}>",
                  str(text),
              )

          def say(*parts) -> None:
              print(scrub(" ".join(str(p) for p in parts)))
          from src.telemetry import pricing, call_ledger

          MODEL = "z-ai/glm-5.3-flash"

          # Why the async path can leave the card empty: _ATTEMPT_FILE is an
          # hour-long throttle and _refresh_in_flight is one global. Any earlier
          # attempt in the same run makes every later call a silent no-op.
          try:
              attempt = os.path.join(call_ledger.telemetry_dir(), "pricing-attempt")
              age = time.time() - os.path.getmtime(attempt) if os.path.exists(attempt) else None
              say(f"[async] attempt marker: {'absent' if age is None else f'{age:.0f}s old'} "
                    f"(throttle {pricing._ATTEMPT_THROTTLE_S}s) in_flight={pricing._refresh_in_flight}")
          except Exception as exc:
              say("[async] marker probe failed:", type(exc).__name__, exc)
          try:
              pricing.ensure_pricing_async()
              time.sleep(6)
              say(f"[async] after 6s: {len(load_rate_card() or {})} entries")
          except Exception as exc:
              say("[async] failed:", type(exc).__name__, exc)

          # Synchronous refresh: raises honestly instead of swallowing the
          # reason in a daemon thread, and seeds the cache the turn reads.
          try:
              rates, source = pricing.refresh()
              say(f"[sync] {len(rates)} rates from {source}")
          except Exception as exc:
              say("[sync] failed:", type(exc).__name__, str(exc)[:220])

          card = load_rate_card() or {}
          say(f"[card] entries={len(card)}")

          # Catalog shape, only if the card is still empty: one line per
          # candidate plus the parser-visible keys. Never prints the key.
          if not card:
              base, key = pricing.provider_config()
              try:
                  for url in (pricing.candidate_urls(base) if base else [])[:4]:
                      try:
                          payload = pricing._http_get_json(url, key, 20.0)
                      except Exception as exc:
                          say(f"[catalog] {url} -> {type(exc).__name__}: {str(exc)[:90]}")
                          continue
                      entries = payload.get("data") if isinstance(payload, dict) else payload
                      if isinstance(entries, dict):
                          entries = entries.get("models") or entries.get("data") or []
                      first = entries[0] if isinstance(entries, list) and entries else {}
                      own = sorted(first)[:8] if isinstance(first, dict) else []
                      pr = first.get("pricing") if isinstance(first, dict) else None
                      say(f"[catalog] {url} -> {len(pricing.parse_catalog(payload, ''))} priced / "
                            f"{len(entries) if isinstance(entries, list) else '?'} entries; "
                            f"keys={own} pricing={sorted(pr)[:6] if isinstance(pr, dict) else pr}")
                      if pricing.parse_catalog(payload, ""):
                          break
              except Exception as exc:
                  say("[catalog] failed:", type(exc).__name__, str(exc)[:120])

          # SUMMARY LAST: the verdict only keeps the tail of this file.
          card = load_rate_card() or {}
          per_m = estimate_cost_usd(MODEL, 1_000_000, 0)
          per_out = estimate_cost_usd(MODEL, 0, 1_000_000)
          say("=" * 60)
          say(f"SUMMARY rate_card_entries={len(card)} {MODEL}: "
                f"input/1M={per_m} output/1M={per_out}")
          if per_m is None:
              say("SUMMARY VERDICT=UNPRICED -> cost is UNKNOWN, USD budget leg abstains. "
                    "Fix: publish prices in the catalog, or set CRUSORAI_RATE_CARD (JSON).")
          else:
              say("SUMMARY VERDICT=PRICED -> the turn's spend is measurable in USD.")
          PY

      - name: Run one real GLM 5.3 turn through the bridge
        env:
          CUSTOM_API_KEY: ${{ secrets.CUSTOM_API_KEY }}
        run: |
          set +e
          python scripts/run_bridge_turn.py \
            --workspace "$RUNNER_TEMP/e2e/ws" \
            --prompt-file "$RUNNER_TEMP/e2e/prompt.txt" \
            --run-id "e2e-glm53-${{ github.run_id }}" \
            --timeout-s 900 \
            --max-llm-calls 20 \
            --max-input-tokens 600000 \
            --results-root "$RUNNER_TEMP/e2e/results" 2>&1 | tee runner.log
          echo "RUNNER_EXIT=${PIPESTATUS[0]}" >> "$GITHUB_ENV"
          # The CLI flag above WINS over AGENT_TOKEN_BUDGET (run_bridge_turn
          # writes env["AGENT_TOKEN_BUDGET"] = effective_max_input_tokens), so
          # the previous 600k env var was decorative beside a 150k wall — and a
          # healthy MVP build was cut at iteration 6 of 20 for it.
          # Copy the log next to the frames so the report can name the budget
          # that actually tripped instead of printing a bare "budget_exhausted".
          cp runner.log "$RUNNER_TEMP/e2e/results/e2e-glm53-${{ github.run_id }}/runner.log" 2>/dev/null || true
          # Capture the outcome explanation HERE, where runner.log provably is,
          # and echo it so the step log carries it too.
          grep -E -e 'finalize ' -e '\[budget\]' -e '\[grace\]' -e 'turn end:' runner.log \
            > "$RUNNER_TEMP/e2e/decision.txt" 2>/dev/null || true
          echo "=== outcome explanation ==="
          cut -c1-400 "$RUNNER_TEMP/e2e/decision.txt" 2>/dev/null | head -12

      - name: Show what the agent actually built
        if: always()
        run: |
          echo "=== workspace tree ==="
          find "$RUNNER_TEMP/e2e/ws" -type f -not -path '*/.git/*' | sort | head -40
          echo
          echo "=== line counts ==="
          find "$RUNNER_TEMP/e2e/ws" -name '*.py' -o -name '*.html' -o -name '*.css' \
            | xargs -r wc -l 2>/dev/null | tail -12
          {
            echo "files:"
            find "$RUNNER_TEMP/e2e/ws" -type f -not -path '*/.git/*' -printf '  %P\n' | sort | head -20
            echo
            find "$RUNNER_TEMP/e2e/ws" \( -name '*.py' -o -name '*.html' -o -name '*.css' \) \
              -exec wc -l {} + 2>/dev/null | tail -8
          } > "$RUNNER_TEMP/e2e/workspace.txt" 2>&1 || true

      - name: Verify the deliverable independently of the agent
        if: always()
        run: |
          set +e
          WS="$RUNNER_TEMP/e2e/ws"
          V="$RUNNER_TEMP/e2e/verify.txt"
          : > "$V"
          say() { echo "$@" | tee -a "$V"; }

          say "=== independent re-test (NOT the agent's own claim) ==="

          # 1. Does the agent's own test file pass when WE run it?
          if [ -f "$WS/mvp/test_server.py" ]; then
            OUT=$( cd "$WS" && timeout 120 python mvp/test_server.py 2>&1 ); RC=$?
            say "agent test file: python mvp/test_server.py -> exit $RC"
            echo "$OUT" | tail -8 | sed 's/^/    /' | tee -a "$V"
            AGENT_TEST_EXIT=$RC
          else
            say "agent test file: MISSING (mvp/test_server.py not written)"
            AGENT_TEST_EXIT=127
          fi

          # 2. Static sanity of every promised file.
          for f in mvp/server.py mvp/index.html mvp/styles.css mvp/test_server.py; do
            if [ -f "$WS/$f" ]; then
              say "file $f: present ($(wc -l < "$WS/$f") lines)"
            else
              say "file $f: MISSING"
            fi
          done
          ( cd "$WS" && python -c "import ast; ast.parse(open('mvp/server.py').read()); print('server.py parses')" ) 2>&1 | sed 's/^/    /' | tee -a "$V"

          # 3. The real contract: start THEIR server and hit /api/health.
          #    A file that parses is not a server that serves; only an HTTP 200
          #    with {"status":"ok"} proves the MVP the prompt asked for.
          if [ -f "$WS/mvp/server.py" ]; then
            ( cd "$WS" && timeout 60 python mvp/server.py >/tmp/srv.log 2>&1 ) &
            SRV=$!
            OK=0
            for _ in $(seq 1 40); do
              sleep 0.5
              CODE=$(curl -s -o /tmp/health.json -w '%{http_code}' --max-time 2 http://127.0.0.1:8137/api/health 2>/dev/null)
              if [ "$CODE" = "200" ]; then OK=1; break; fi
            done
            say "live HTTP /api/health -> ${CODE:-no-response}"
            say "health body: $(head -c 200 /tmp/health.json 2>/dev/null)"
            if [ "$OK" = "1" ] && python -c "import json,sys; sys.exit(0 if json.load(open('/tmp/health.json')).get('status')=='ok' else 1)" 2>/dev/null; then
              say "LIVE CONTRACT: PASS (HTTP 200 + status=ok)"
              LIVE_EXIT=0
            else
              say "LIVE CONTRACT: FAIL"
              tail -5 /tmp/srv.log 2>/dev/null | sed 's/^/    /' | tee -a "$V"
              LIVE_EXIT=1
            fi
            kill $SRV 2>/dev/null; wait $SRV 2>/dev/null
          else
            say "LIVE CONTRACT: FAIL (no server.py)"
            LIVE_EXIT=1
          fi

          # 4. Does index.html actually reference the health element the
          #    prompt demanded (id="health") and fetch the API?
          if [ -f "$WS/mvp/index.html" ]; then
            say "index.html references /api/health: $(grep -c 'api/health' "$WS/mvp/index.html")"
            say "index.html has element id=health: $(grep -c 'id="health"\|id=health' "$WS/mvp/index.html")"
          fi

          echo "AGENT_TEST_EXIT=$AGENT_TEST_EXIT" >> "$GITHUB_ENV"
          echo "LIVE_EXIT=$LIVE_EXIT" >> "$GITHUB_ENV"
          if [ "$AGENT_TEST_EXIT" = "0" ] && [ "$LIVE_EXIT" = "0" ]; then
            say "DELIVERABLE VERDICT: PASS (independent)"
          else
            say "DELIVERABLE VERDICT: FAIL (independent)"
          fi

      - name: E2E core report (invariants I1-I4)
        if: always()
        run: |
          set +e
          python scripts/e2e_core_report.py \
            --run-dir "$RUNNER_TEMP/e2e/results/e2e-glm53-${{ github.run_id }}" \
            --model-label "z-ai/glm-5.3-flash" \
            --require-completed \
            --out "$RUNNER_TEMP/e2e/E2E_CORE_REPORT.md"
          echo "REPORT_EXIT=$?" >> "$GITHUB_ENV"
          exit 0

      - name: Redact credential material from prior verdicts
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The verdict is a PUBLIC artifact: a fingerprint (length + last four)
          # is allowed, a value never is. On 2026-11-01 a urllib header error
          # quoted the Bearer value into this issue; scrub idempotently before
          # posting anything new.
          python - <<'PY'
          import json, os, re, urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          issue = os.environ.get("TRACKING_ISSUE", "28")
          token = os.environ["GH_TOKEN"]
          api = f"https://api.github.com/repos/{repo}"
          pattern = re.compile(r"key_live_[A-Za-z0-9_]+")

          def call(method, url, payload=None):
              data = json.dumps(payload).encode() if payload is not None else None
              req = urllib.request.Request(url, data=data, method=method, headers={
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json",
                  "Content-Type": "application/json",
                  "User-Agent": "crusorai-e2e-redactor",
              })
              with urllib.request.urlopen(req, timeout=30) as resp:
                  return json.loads(resp.read().decode("utf-8", "replace"))

          def scrub(match):
              value = match.group(0)
              return f"<REDACTED len={len(value)} \u2026{value[-4:]}"

          try:
              comments = call("GET", f"{api}/issues/{issue}/comments?per_page=100")
          except Exception as exc:
              print("could not list comments:", type(exc).__name__, str(exc)[:160])
              raise SystemExit(0)

          fixed = 0
          for comment in comments:
              body = comment.get("body") or ""
              if not pattern.search(body):
                  continue
              try:
                  call("PATCH", f"{api}/issues/comments/{comment['id']}",
                       {"body": pattern.sub(scrub, body)})
                  fixed += 1
              except Exception as exc:
                  print(f"could not redact {comment['id']}:", type(exc).__name__, str(exc)[:120])
          print(f"redacted {fixed} comment(s)")
          PY

      - name: Post the report to the tracking issue
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE: '28'
        run: |
          set -euo pipefail
          REPORT=$(cat "$RUNNER_TEMP/e2e/E2E_CORE_REPORT.md" 2>/dev/null | head -60 || echo "no report")
          # Both of these are where a transport failure explains itself, and
          # Actions logs are not reachable from every environment.
          KEYNOTE=$(cat "$RUNNER_TEMP/e2e/key-normalise.txt" 2>/dev/null || echo "no key note")
          PRICING=$(tail -c 1800 "$RUNNER_TEMP/e2e/pricing.txt" 2>/dev/null || echo "no pricing output")
          BUILT=$(cat "$RUNNER_TEMP/e2e/workspace.txt" 2>/dev/null | head -25 || echo "no workspace listing")
          VERIFY=$(cat "$RUNNER_TEMP/e2e/verify.txt" 2>/dev/null | head -40 || echo "no independent verification output")
          # The stderr tail is truncated to ~900 bytes, so the one line that
          # explains the outcome could scroll out. Grep it deliberately.
          # Belt and braces: the turn step writes decision.txt, but a missing
          # capture must never print a bare dash again. Fall back to grepping
          # every runner.log we might have (run dir copy, then repo root), and
          # if THAT fails, show the tail so the next reader can see why.
          # The bridge writes its own stderr to bridge_stderr.log in the run
          # directory; runner.log only carries the driver's own output. That is
          # why grepping runner.log found nothing while the verdict's stderr
          # tail was full of finalize lines.
          RUNLOG="$RUNNER_TEMP/e2e/results/e2e-glm53-${{ github.run_id }}"
          DECISION=$(grep -hE -e 'finalize ' -e '\[budget\]' -e '\[grace\]' -e 'turn end:' \
            "$RUNLOG/bridge_stderr.log" "$RUNLOG/runner.log" 2>/dev/null | cut -c1-400 | head -14)
          if [ -z "$DECISION" ]; then
            DECISION=$(cut -c1-400 "$RUNNER_TEMP/e2e/decision.txt" 2>/dev/null | head -14)
          fi
          if [ -z "$DECISION" ]; then
            DECISION="NO FINALIZE LINES FOUND. runner.log bytes: $(wc -c < runner.log 2>/dev/null || echo missing)
          --- tail of runner.log ---
          $(tail -6 runner.log 2>/dev/null | cut -c1-300)"
          fi
          PROBE=$(tail -c 1200 "$RUNNER_TEMP/e2e/probe.txt" 2>/dev/null || echo "no probe output")
          STDERR=$(tail -c 1500 "$RUNNER_TEMP/e2e/results/e2e-glm53-${{ github.run_id }}/bridge_stderr.log" 2>/dev/null || echo "no bridge stderr")
          REPORT=$(printf '%s\n\n### why the turn ended\n```\n%s\n```\n\n### independent re-test of the deliverable\n```\n%s\n```\n\n### what the agent actually wrote\n```\n%s\n```\n\n### credential\n```\n%s\n```\n\n### pricing\n```\n%s\n```\n\n### SDK probe\n```\n%s\n```\n\n### bridge stderr (tail)\n```\n%s\n```' \
            "$REPORT" "$DECISION" "$VERIFY" "$BUILT" "$KEYNOTE" "$PRICING" "$PROBE" "$STDERR")
          BODY=$(printf '**E2E agent core — GLM 5.3** `%s` @ `%s`\nrunner_exit=%s\n\n%s\n' \
            "$GITHUB_WORKFLOW" "${GITHUB_SHA:0:8}" "${RUNNER_EXIT:-unknown}" "$REPORT")
          printf '%s' "$BODY" > body.md
          gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE/comments" -F body=@body.md > /dev/null \
            && echo "report posted" || echo "post skipped"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-glm53-evidence
          path: |
            ${{ runner.temp }}/e2e/E2E_CORE_REPORT.md
            ${{ runner.temp }}/e2e/results/**/frames.jsonl
            ${{ runner.temp }}/e2e/results/**/outcome.json
            ${{ runner.temp }}/crusorai/traces/*.jsonl
            # The thing the agent actually built. Without this the MVP is
            # deleted with the runner, so "it passed" is the only artifact and
            # there is nothing to launch. Exclude bytecode caches.
            ${{ runner.temp }}/e2e/ws/mvp/**
            !${{ runner.temp }}/e2e/ws/mvp/**/__pycache__/**
          if-no-files-found: warn

  continuous-benchmark:
    name: Continuous e-commerce benchmark (GLM 5.3)
    if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[continuous-benchmark]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      LLM_PROVIDER: custom
      LLM_MODEL: z-ai/glm-5.3-flash
      CONTEXT_MODEL: z-ai/glm-5.3-flash
      AUX_LLM_PROVIDER: custom
      AUX_LLM_MODEL: z-ai/glm-5.3-flash
      CUSTOM_BASE_URL: https://velona.in/v1
      CRUSORAI_DISABLE_LONG_TERM_MEMORY: '1'
      CRUSORAI_MEMORY: 'off'
      CRUSORAI_PREVIEW_AUTOSTART: '0'
      CRUSORAI_SUBAGENT_DEPTH: '0'
      CRUSORAI_LLM_STREAMING: '1'
      CRUSORAI_LLM_TIMEOUT: '180'
      CRUSORAI_LLM_STALL_TIMEOUT_S: '180'
      CRUSORAI_DELIVERY_MAX_TOKENS: '8192'
      AGENT_COST_BUDGET: '0.60'
      CRUSORAI_HTTP_USER_AGENT: >-
        Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36
        (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install runtime and verification dependencies
        run: |
          python -m pip install --upgrade pip
          pip install langchain-core langgraph langgraph-checkpoint-sqlite langgraph-prebuilt \
            langchain langchain-openai langchain-google-genai langchain-groq groq google-genai \
            copilotkit ag-ui-langgraph aiosqlite sqlite-vec watchdog tree-sitter \
            tree-sitter-javascript tree-sitter-typescript tree-sitter-go tree-sitter-rust \
            tree-sitter-java httpx rich typer fastapi uvicorn flask flask-cors pillow mcp \
            opentelemetry-api opentelemetry-sdk opentelemetry-exporter-otlp-proto-http \
            ddgs tiktoken pydantic python-dotenv pytest
      - name: Check prompt identity and create isolated workspace
        run: |
          echo '8e98b4886c4241f4f66e6f6a575c192bf917d07cf2adf2272e0dfa63046c315c  benchmark_ecommerce_prompt.txt' | sha256sum --check
          mkdir -p "$RUNNER_TEMP/continuous/ws" "$RUNNER_TEMP/continuous/results" "$RUNNER_TEMP/continuous/evidence"
      - name: Seed and validate pricing before a paid turn
        env:
          CUSTOM_API_KEY: ${{ secrets.CUSTOM_API_KEY }}
        run: |
          python - <<'PY'
          from src.telemetry import pricing
          from src.telemetry.call_ledger import estimate_cost_usd
          try:
              rates, source = pricing.refresh()
              print('rate_entries=', len(rates), 'source=', source)
          except Exception as exc:
              print('pricing refresh failed:', type(exc).__name__)
          for direction, args in [('input', (1000000, 0)), ('output', (0, 1000000))]:
              value = estimate_cost_usd('z-ai/glm-5.3-flash', *args)
              print(direction, 'estimated USD/1M=', value)
              if value is None:
                  raise SystemExit('Cannot enforce cost budget without pricing; stopping before paid turn')
          PY
      - name: Run continuous benchmark
        env:
          CUSTOM_API_KEY: ${{ secrets.CUSTOM_API_KEY }}
        run: |
          set -o pipefail
          python scripts/run_bridge_turn.py \
            --continuous \
            --workspace "$RUNNER_TEMP/continuous/ws" \
            --prompt-file benchmark_ecommerce_prompt.txt \
            --run-id "continuous-glm-${{ github.run_id }}" \
            --timeout-s 1100 \
            --max-input-tokens 2500000 \
            --results-root "$RUNNER_TEMP/continuous/results" \
            2>&1 | tee "$RUNNER_TEMP/continuous/runner.log"
      - name: Independent workspace checks
        if: always()
        run: |
          set +e
          WS="$RUNNER_TEMP/continuous/ws"
          OUT="$RUNNER_TEMP/continuous/evidence/independent.txt"
          mkdir -p "$(dirname "$OUT")" "$WS"
          echo '=== workspace file list ===' | tee "$OUT"
          find "$WS" -type f -not -path '*/diagnostics/*' -not -path '*/node_modules/*' -not -path '*/__pycache__/*' -printf '%P\n' | sort | head -120 | tee -a "$OUT"
          echo '=== python compilation ===' | tee -a "$OUT"
          python -m compileall -q "$WS" 2>&1 | tee -a "$OUT"
          echo "compile_exit=${PIPESTATUS[0]}" | tee -a "$OUT"
          echo '=== test files ===' | tee -a "$OUT"
          find "$WS" -type f \( -name 'test_*.py' -o -name '*_test.py' \) -not -path '*/diagnostics/*' -not -path '*/node_modules/*' -print | tee -a "$OUT"
          if find "$WS" -type f \( -name 'test_*.py' -o -name '*_test.py' \) -not -path '*/diagnostics/*' -not -path '*/node_modules/*' -print -quit | grep -q .; then
            (cd "$WS" && timeout 120 python -m pytest -q --disable-warnings --ignore=diagnostics) 2>&1 | tee -a "$OUT"
            echo "pytest_exit=${PIPESTATUS[0]}" | tee -a "$OUT"
          else
            echo 'pytest: NOT RUN (no Python test files)' | tee -a "$OUT"
          fi
      - name: Prepare redacted evidence
        if: always()
        env:
          CUSTOM_API_KEY: ${{ secrets.CUSTOM_API_KEY }}
        run: |
          python - <<'PY'
          import os, re, shutil
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'continuous'
          out = root / 'evidence'
          out.mkdir(parents=True, exist_ok=True)
          key = (os.environ.get('CUSTOM_API_KEY') or '').strip()
          for base, dest in ((root / 'results', out / 'results'), (root / 'ws', out / 'workspace')):
              for p in base.rglob('*') if base.exists() else []:
                  if not p.is_file() or p.is_symlink() or p.stat().st_size > 5_000_000:
                      continue
                  rel = p.relative_to(base)
                  if any(x in {'.git', 'node_modules', '__pycache__', '.env'} for x in rel.parts):
                      continue
                  if base.name == 'ws' and p.suffix.lower() not in {'.py', '.js', '.ts', '.tsx', '.jsx', '.json', '.jsonl', '.html', '.css', '.md', '.txt', '.yaml', '.yml'}:
                      continue
                  try:
                      text = p.read_text(encoding='utf-8')
                  except (UnicodeError, OSError):
                      continue
                  if key:
                      text = text.replace(key, '[REDACTED]')
                  text = re.sub(r'key_live_[A-Za-z0-9_]+', '[REDACTED]', text)
                  target = dest / rel
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_text(text, encoding='utf-8')
          log = root / 'runner.log'
          if log.exists():
              text = log.read_text(encoding='utf-8', errors='replace')
              if key:
                  text = text.replace(key, '[REDACTED]')
              text = re.sub(r'key_live_[A-Za-z0-9_]+', '[REDACTED]', text)
              (out / 'runner.log').write_text(text, encoding='utf-8')
          PY
      - name: Upload redacted benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: continuous-ecommerce-glm-evidence
          path: ${{ runner.temp }}/continuous/evidence
          if-no-files-found: warn

  collect-continuous-evidence:
    name: Collect existing redacted benchmark evidence (no model calls)
    if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[collect-evidence:') && startsWith(github.ref, 'refs/heads/arena/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download and persist evidence from the earlier run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          RUN_ID=$(python -c 'import os,re; m=re.search(r"\[collect-evidence:(\d+)\]", os.environ["HEAD_MESSAGE"]); assert m; print(m.group(1))')
          DEST="docs/benchmarks/continuous-evidence-$RUN_ID"
          mkdir -p "$DEST" "$RUNNER_TEMP/collected-evidence"
          gh run download "$RUN_ID" --name continuous-ecommerce-glm-evidence --dir "$RUNNER_TEMP/collected-evidence"
          cp -R "$RUNNER_TEMP/collected-evidence/." "$DEST/"
          find "$DEST" -type f -printf '%P (%s bytes)\n' | sort
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f "$DEST"
          if ! git diff --cached --quiet; then
            git commit -m "Capture redacted continuous benchmark evidence $RUN_ID [skip ci]"
            git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
          fi
