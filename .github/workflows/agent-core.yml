          path: |
            .test-reports/group-05.xml
            .test-reports/group-05.log
            .test-reports/summary-group-05.json
          if-no-files-found: warn
          retention-days: 14

      - name: Aggregate group results
        # The gate. Explicit, and it fails when any group failed, timed out,
        # failed collection, or never produced a summary.
        if: always()
        run: |
          python - <<'PY'
          import glob, json, sys
          files = sorted(glob.glob(".test-reports/summary-*.json"))
          bad, seen = [], []
          for f in files:
              s = json.load(open(f))
              for r in s["results"]:
                  seen.append(r["group"])
                  print(f"{r['group']}: {r['status']} exit={r['exit']} {r['junit']}")
                  if r["status"] != "ok":
                      bad.append((r["group"], r["status"]))
          print(f"groups reported: {len(seen)}")
          if len(seen) != 12:
              sys.exit(f"expected 12 groups, found {len(seen)}: {sorted(seen)}")
          if bad:
              sys.exit(f"failing groups: {bad}")
          PY

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-diagnostics
          path: |
            diagnostics/
            .pytest_cache/
          if-no-files-found: ignore
          retention-days: 7
