name: agent-core

# Audit 2026-10-12: the repo had no CI. That is HOW a shipped prompt silently
# lost its parallel-tool-calling guidance (a `.replace()` no-op) and 39 red
# tests sat on main unnoticed. This workflow runs the same hermetic runner the
# team uses locally â€” it unsets provider keys, gives every run a throwaway
# HOME, and pins TZ/locale â€” so "green here" means exactly "green on a laptop".

on:
  push:
    branches: ["main", "arena/**"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: hermetic test suite (py3.14)
    runs-on: ubuntu-latest
    # 12 isolated groups + install. Run 43405656459 was still executing at 35m;
    # run 43410282051 lost the runner at 51m. 120 is a job cap, not a measured
    # duration; per-group caps are 1800s in the run steps.
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install runtime + test dependencies
        # Full dependency set on purpose: the suite covers language extractors
        # (tree-sitter grammars), screenshot quality (Pillow), and the browser
        # tools â€” a CI that skips them would report green on a crippled
        # environment, which is the failure mode this workflow exists to end.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . --group dev

      - name: Install pyright (LSP fast-path coverage)
        # test_lsp_performance spawns a real pyright-langserver. Without it the
        # test times out and looks like a product bug; with it on PATH the
        # server is found and the fast-path/delta behaviour is actually graded.
        run: npm install -g pyright

      - name: Install desktop parity dependencies
        # Install into an isolated directory. Running `npm install` inside
        # desktop/vscode pulls the fork's whole dependency tree, and `kerberos`
        # needs krb5 headers that the runner does not have - the step died in
        # node-gyp before the suite ever started (run 43404607498).
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/parity-deps"
          cd "$RUNNER_TEMP/parity-deps"
          npm init -y >/dev/null
          npm install --no-audit --no-fund \
            esbuild@0.25.0 typescript@npm:@typescript/typescript6@6.0.2
          mkdir -p "$GITHUB_WORKSPACE/desktop/vscode/node_modules"
          cp -R node_modules/esbuild "$GITHUB_WORKSPACE/desktop/vscode/node_modules/"
          cp -R node_modules/typescript "$GITHUB_WORKSPACE/desktop/vscode/node_modules/"

      - name: Plan test groups
        # One deterministic plan for the whole job. The plan is validated against
        # the expected names so a silent group drift fails here, not at 3am.
        run: |
          python scripts/run_test_groups.py --plan-only --groups 12 --out .test-reports
          python - <<'PY'
          import json, sys
          expected = {
            "heavy-test_security_containment",
            "heavy-test_desktop_renderer_architecture",
            "heavy-test_hermes_browser_tools",
            "heavy-test_lab_fixes",
            "heavy-test_phase_11_8_production_readiness",
            "heavy-test_hermes_prompt_parity",
            "group-00",
            "group-01",
            "group-02",
            "group-03",
            "group-04",
            "group-05",
          }
          plan = json.load(open(".test-reports/plan.json"))
          names = {g["name"] for g in plan["groups"]}
          missing, extra = expected - names, names - expected
          print("planned groups:", sorted(names))
          if missing or extra:
              sys.exit(f"plan drift: missing={sorted(missing)} extra={sorted(extra)}")
          PY

      - name: Run heavy-test_security_containment
        # if: always() so one failing group cannot prevent the remaining groups
        # from producing evidence. The step still fails the job; the aggregate
        # step below is what decides the gate.
        if: always()
        env:
          CRUSORAI_TEST_PYTHON: python
          CRUSORAI_PREVIEW_AUTOSTART: "0"
        run: |
          python scripts/run_test_groups.py --only-group heavy-test_security_containment --groups 12 \
            --group-timeout 1800 --out .test-reports

      - name: Upload heavy-test_security_containment report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-heavy-test_security_containment
          path: |
            .test-reports/heavy-test_security_containment.xml
            .test-reports/heavy-test_security_containment.log
            .test-reports/summary-heavy-test_security_containment.json
          if-no-files-found: warn
          retention-days: 14

      - name: Run heavy-test_desktop_renderer_architecture
