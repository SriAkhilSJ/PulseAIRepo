name: agent-core

# Audit 2026-10-12: the repo had no CI. That is HOW a shipped prompt silently
# lost its parallel-tool-calling guidance (a `.replace()` no-op) and 39 red
# tests sat on main unnoticed. This workflow runs the same hermetic runner the
# team uses locally â€” it unsets provider keys, gives every run a throwaway
# HOME, and pins TZ/locale â€” so "green here" means exactly "green on a laptop".

on:
  push:
    branches: ["main", "arena/**"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: hermetic test suite (py3.14)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install runtime + test dependencies
        # Full dependency set on purpose: the suite covers language extractors
        # (tree-sitter grammars), screenshot quality (Pillow), and the browser
        # tools â€” a CI that skips them would report green on a crippled
        # environment, which is the failure mode this workflow exists to end.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . --group dev

      - name: Install pyright (LSP fast-path coverage)
        # test_lsp_performance spawns a real pyright-langserver. Without it the
        # test times out and looks like a product bug; with it on PATH the
        # server is found and the fast-path/delta behaviour is actually graded.
        run: npm install -g pyright

      - name: Install desktop parity dependencies
        # The two parity modules compare the tracked build output against the
        # current TypeScript sources. Without these they SKIP, which is a false
        # green: the lane that is supposed to gate PRs never runs. Pinned so a
        # new esbuild major cannot silently change bundle output.
        working-directory: desktop/vscode
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund \
            esbuild@0.25.0 typescript@npm:@typescript/typescript6@6.0.2

      - name: Run hermetic test suite
        env:
          CRUSORAI_TEST_PYTHON: python
          # Keep artifacts out of the runner's real HOME (the runner does this
          # itself; set explicitly so a future runner change cannot regress it).
          CRUSORAI_PREVIEW_AUTOSTART: "0"
        # T-18: the whole suite runs here, including the desktop parity pins.
        # They used to be excluded and parked in a non-blocking job, which
        # meant a red parity pin could never fail a pull request. A gate that
        # cannot fail is not a gate.
        # --durations gives the attribution the 30-minute timeout currently
        # lacks. The timeout stays 30 until a real Linux run measures it.
        run: |
          bash scripts/run_tests.sh src/tests -q --durations=50 --durations-min=1.0

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-diagnostics
          path: |
            diagnostics/
            .pytest_cache/
          if-no-files-found: ignore
          retention-days: 7
