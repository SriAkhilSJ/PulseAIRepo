name: Stop Kaggle Colibri Kernel

on:
  push:
    branches:
      - arena/a7c2c868-pulseairepo

permissions:
  contents: read

jobs:
  stop-private-kernel:
    name: Stop exact private Kaggle kernel
    if: contains(github.event.head_commit.message, '[kaggle-stop]')
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Set up Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'

      - name: Install pinned Kaggle client
        run: python -m pip install --disable-pip-version-check kaggle==1.8.4

      - name: Delete exact private kernel
        env:
          KAGGLE_USERNAME: sriakhilsj
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_API_TOKEN }}
        run: >-
          kaggle kernels delete
          sriakhilsj/pulseai-colibri-agent-core-40455009090
          --yes
