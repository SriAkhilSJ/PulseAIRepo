[pytest]
testpaths = src/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short
# REQUIRED: repo-root on sys.path so `from src...` imports resolve at
# collection time (omitted from the original suggestion; without it every
# test errors with ModuleNotFoundError).
pythonpath = .
